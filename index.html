<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXOM — Independent Intelligence</title>
<meta name="description" content="Think off-script. An independent AI workspace for ideas, code, and everything in between.">
<meta name="theme-color" content="#111110">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root,[data-theme=dark]{
  --bg:#0b0c0e;--bg2:#111216;--surf:#16171d;--elev:#1e2029;--elev-hover:#262936;--input:#13141a;
  --bd:#232530;--bd-focus:#3b82f6;--tx:#f8fafc;--tx2:#94a3b8;--tx3:#64748b;--ac:#3b82f6;--ach:#2563eb;
  --ac-glow:rgba(59,130,246,.25);--acid:#38bdf8;--ok:#10b981;--err:#f43f5e;--cyan:#06b6d4;
  --sh:0 4px 20px rgba(0,0,0,.25);--ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f8fafc;--bg2:#f1f5f9;--surf:#ffffff;--elev:#e2e8f0;--elev-hover:#cbd5e1;--input:#ffffff;
  --bd:#e2e8f0;--bd-focus:#3b82f6;--tx:#0f172a;--tx2:#475569;--tx3:#64748b;--ac:#2563eb;--ach:#1d4ed8;
  --ac-glow:rgba(37,99,235,.18);--acid:#0284c7;--ok:#059669;--err:#e11d48;--cyan:#0891b2;
  --sh:0 4px 20px rgba(0,0,0,.08);--ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--ac);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

.app{display:flex;height:100dvh;position:relative;z-index:1;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(59,130,246,0)}50%{box-shadow:0 0 16px rgba(59,130,246,.3)}}

.ib{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;color:var(--tx2);transition:all .15s ease}
.ib:hover{background:var(--elev);color:var(--tx)}
.ib:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--surf);font-size:11px;font-weight:500;color:var(--tx);transition:all .15s ease}
.btn:hover{background:var(--elev);border-color:var(--tx3)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--ach);box-shadow:0 2px 10px rgba(59,130,246,.4)}
.btn.dng{color:var(--err);border-color:rgba(244,63,94,.25);background:rgba(244,63,94,.08)}
.btn.dng:hover{background:rgba(244,63,94,.18);border-color:var(--err)}

/* sidebar */
.side{width:260px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 14px 14px;transition:width .25s var(--ease);flex:none;overflow:hidden;position:relative}
.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo-btn{display:inline-flex;align-items:center;gap:8px;text-align:left;border:0;background:none;cursor:pointer;transition:opacity .15s ease}
.logo-btn:hover{opacity:.85}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b82f6 0%,#06b6d4 100%);display:grid;place-items:center;color:#fff;box-shadow:0 2px 8px rgba(59,130,246,.35);flex-shrink:0}
.logo-mark svg{width:15px;height:15px}
.logo-text{font:700 16px/1 Inter,sans-serif;letter-spacing:-0.02em;color:var(--tx)}
.logo-tag{font:600 9.5px 'JetBrains Mono',monospace;background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25);padding:1.5px 5px;border-radius:4px}
.side-collapse-btn{color:var(--tx3)}
.side-collapse-btn:hover{color:var(--tx)}
.side .row{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:6px;color:var(--tx2);font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;transition:all .15s ease}
.side .row:hover{background:var(--elev);color:var(--tx)}
.side .new-chat{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.28);color:#60a5fa;border-radius:8px;padding:8px 12px;font-weight:500;font-size:12px;transition:all .15s ease;margin-bottom:10px}
.side .new-chat:hover{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 12px rgba(59,130,246,.35)}
.new-chat kbd{margin-left:auto;font:10px 'JetBrains Mono',monospace;opacity:.7}
.search{margin:0 0 10px;position:relative}
.search input{width:100%;background:var(--input);border:1px solid var(--bd);border-radius:8px;padding:7px 28px 7px 30px;font-size:12px;outline:0;transition:border-color .15s ease;color:var(--tx)}
.search input:focus{border-color:var(--bd-focus)}
.search svg{position:absolute;left:8px;top:8px;width:14px;height:14px;color:var(--tx3)}
.search kbd{position:absolute;right:8px;top:7px;color:var(--tx3);font:10px 'JetBrains Mono',monospace;pointer-events:none}
.list{flex:1;overflow-y:auto;padding-right:2px}
.grp{font:600 10px 'JetBrains Mono',monospace;text-transform:uppercase;color:var(--tx3);padding:10px 8px 4px;letter-spacing:0.06em}
.item{position:relative;display:flex;align-items:center;margin-bottom:2px}
.item .row{flex:1;min-width:0;font-size:12px;color:var(--tx2);padding:7px 10px;border-radius:6px;transition:all .15s ease;display:flex;align-items:center;gap:8px}
.item .row:hover{background:var(--elev);color:var(--tx)}
.item .row.on{background:rgba(59,130,246,.12);color:#f8fafc;font-weight:500;border-left:2px solid var(--ac)}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .more{position:absolute;right:4px;opacity:0;width:24px;height:24px;border-radius:4px;background:var(--elev);transition:all .15s}
.item:hover .more,.item .more:focus-visible{opacity:1}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--bd)}
.side-user-btn{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;transition:all .15s ease;text-align:left;border:0;background:none;cursor:pointer}
.side-user-btn:hover{background:var(--elev)}
.side-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1e293b,#334155);border:1px solid rgba(255,255,255,.12);color:#f8fafc;display:grid;place-items:center;font:600 12px Inter,sans-serif;flex-shrink:0}
.side-user-meta{flex:1;min-width:0}
.side-user-name{font-size:12px;font-weight:500;color:var(--tx);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user-badge{font:500 9.5px 'JetBrains Mono',monospace;color:var(--tx3);display:block}
.side-gear-icon{color:var(--tx3);margin-left:auto}
.side-user-btn:hover .side-gear-icon{color:var(--tx)}
mark{background:rgba(59,130,246,.25);color:var(--tx);border-radius:2px;padding:0 2px}

/* sidebar collapsed */
.side.col{width:64px;padding:16px 8px 14px}
.side.col .side-top{justify-content:center;margin-bottom:12px}
.side.col .logo-text,.side.col .logo-tag,.side.col .side-collapse-btn,.side.col .lbl,.side.col .search,.side.col .grp,.side.col kbd,.side.col .side-user-meta{display:none}
.side.col .new-chat{padding:8px;justify-content:center;margin-bottom:8px}
.side.col .row{justify-content:center;padding:8px}
.side.col .side-user-btn{justify-content:center;padding:4px}
.side.col .side-gear-icon{display:none}
.colonly{display:none}.side.col .colonly{display:flex}

/* main section */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{height:54px;min-height:54px;padding:0 20px;border-bottom:1px solid var(--bd);gap:12px;background:var(--bg);display:flex;align-items:center;transition:background .2s}
.hdr .ttl{flex:0 1 auto;text-align:left;font:500 12px Inter,sans-serif;color:var(--tx3);display:flex;align-items:center;gap:6px}
.hdr .ttl b{color:var(--tx);font-weight:600}
.hdr .sp{flex:1}

/* language switch in header */
.lang-switch{display:inline-flex;align-items:center;border:1px solid var(--bd);background:var(--input);border-radius:6px;padding:2px;gap:2px}
.lang-btn{padding:3px 8px;font:10px 'JetBrains Mono',monospace;color:var(--tx3);border-radius:4px;transition:all .15s ease;border:0;background:none;cursor:pointer}
.lang-btn:hover{color:var(--tx)}
.lang-btn.on{background:var(--elev);color:var(--tx);font-weight:600}

/* chat container */
.chat{flex:1;overflow:auto;scrollbar-gutter:stable;scroll-behavior:smooth}
.col-in{max-width:860px;padding:0 28px;margin:auto}
.session-label{font:500 10px/1 'JetBrains Mono',monospace;color:var(--tx3);border-bottom:1px solid var(--bd);padding:22px 0 16px;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px;animation:rise .3s var(--ease)}
.msg{padding:12px 0 20px;animation:rise .3s var(--ease)}
.msg.in{animation:rise .35s var(--ease)}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .who{display:none}
.msg.user .bd{background:#27272a;border:1px solid #3f3f46;border-radius:14px;border-bottom-right-radius:4px;font-size:14px;line-height:1.55;padding:10px 16px;white-space:pre-wrap;color:#f4f4f5;max-width:82%;box-shadow:0 2px 8px rgba(0,0,0,.15);letter-spacing:-.01em}
.msg:not(.user) .who{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.6px;color:#71717a;text-transform:uppercase;margin-bottom:10px}
.msg:not(.user) .bd{padding:0;font-size:14.5px;line-height:1.7;color:#e4e4e7;overflow-wrap:anywhere}
.bd p{margin:0 0 14px}.bd p:last-child{margin-bottom:0}
.bd h1,.bd h2,.bd h3,.bd h4{color:#ffffff;font-weight:600;letter-spacing:-.015em;margin:22px 0 10px}
.bd h1{font-size:20px}.bd h2{font-size:17px}.bd h3{font-size:15px}
.bd ul,.bd ol{margin:10px 0 16px;padding-left:22px}
.bd li{margin-bottom:6px;line-height:1.65}
.bd strong{font-weight:600;color:#ffffff}
.bd.live>:last-child::after{content:'';display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:text-bottom;background:var(--ac);animation:blink .9s steps(1) infinite}
.bd code{font:12.5px/1.4 'JetBrains Mono',Consolas,Monaco,monospace;background:#202024;color:#f4f4f5;padding:2.5px 6px;border-radius:5px;border:1px solid #2e2e34}
.bd blockquote{margin:12px 0;padding-left:14px;border-left:3px solid var(--ac);color:var(--tx2);font-style:italic}
.bd a{color:var(--ac);text-decoration:underline;text-underline-offset:3px;transition:opacity .15s}
.bd a:hover{opacity:.85}

/* modern code blocks */
.cb{margin:16px 0 20px;background:#18181b;border:1px solid #27272a;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cb header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#1f1f23;border-bottom:1px solid #27272a;font:500 11px/1 'JetBrains Mono',monospace;color:#a1a1aa}
.cb-tag{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;text-transform:lowercase;letter-spacing:.3px;color:#a1a1aa}
.cb-tag svg{width:13px;height:13px;color:#71717a}
.cb-actions{display:flex;align-items:center;gap:6px}
.cb header .btn-copy{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:transparent;border:1px solid transparent;border-radius:5px;font:500 11px 'JetBrains Mono',monospace;color:#a1a1aa;transition:all .15s;cursor:pointer}
.cb header .btn-copy:hover{background:#27272a;color:#ffffff;border-color:#3f3f46}
.cb header .btn-copy svg{width:12px;height:12px}
.cb pre{margin:0;padding:14px 16px;overflow-x:auto;font:13px/1.6 'JetBrains Mono',Consolas,Monaco,monospace;color:#f4f4f5}
.cb pre code{background:none;border:0;padding:0;color:inherit;font:inherit}

/* markdown tables */
.table-wrap{width:100%;overflow-x:auto;margin:18px 0 22px}
.bd table{width:100%;border-collapse:collapse;font-size:13.5px}
.bd th{text-align:left;padding:10px 18px 10px 0;font-weight:600;color:#ffffff;border-bottom:1px solid #27272a;font-size:13px;letter-spacing:-.01em}
.bd td{padding:12px 18px 12px 0;color:#d4d4d8;border-bottom:1px solid #1f1f23;line-height:1.55}
.bd tr:last-child td{border-bottom:none}

.acts{display:flex;gap:4px;margin-top:12px;opacity:0.6;transition:opacity .2s}
.msg:hover .acts{opacity:1}
.acts .ib{width:26px;height:26px;border-radius:6px;color:var(--tx3);transition:all .15s}
.acts .ib:hover{background:var(--elev);color:var(--tx)}
.acts .ib.on{color:var(--ac);background:rgba(59,130,246,.12)}

/* welcome / empty home screen */
.home-view .main{justify-content:center;align-items:center}
.home-view .hdr{position:absolute;top:0;left:0;right:0;border-bottom:1px solid var(--bd)}
.home-view .chat{flex:0 0 auto;overflow:visible;width:100%;max-width:840px;margin-top:auto}
.home-view .col-in{width:100%;max-width:840px;padding:0 20px;margin:0 auto}
.empty{width:100%;text-align:center;position:relative;margin:0 auto 24px;animation:rise .4s var(--ease)}
.home-hero{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-emblem{position:relative;width:48px;height:48px;margin-bottom:6px}
.hero-glow{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.4) 0%,rgba(6,182,212,0) 70%);filter:blur(8px);animation:pulseGlow 3s infinite ease-in-out}
.hero-icon{position:relative;width:100%;height:100%;border-radius:12px;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;color:#38bdf8;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.hero-icon svg{width:24px;height:24px}
.hero-title{font:600 28px/1.25 Inter,sans-serif;letter-spacing:-0.03em;margin:0;color:var(--tx)}
.hero-sub{font-size:13.5px;color:var(--tx2);margin:0;max-width:480px;line-height:1.5}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.hero-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surf);border:1px solid var(--bd);border-radius:20px;font:500 11px 'JetBrains Mono',monospace;color:var(--tx3)}
.hero-chip svg{width:12px;height:12px;color:var(--ac)}

/* composer / input */
.comp{padding:16px 36px 20px;position:relative;transition:all .3s var(--ease)}
.home-view .comp{padding:0 20px;width:100%;max-width:840px;margin:0 auto auto;animation:rise .4s var(--ease) .1s backwards}
.cbox{max-width:840px;margin:0 auto;padding:12px 14px 10px;background:var(--input);border:1px solid var(--bd);border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.25);position:relative;transition:all .2s ease}
.cbox:hover{border-color:#333647}
.cbox:focus-within,.cbox.drag{border-color:rgba(59,130,246,.65);box-shadow:0 0 0 1px rgba(59,130,246,.35),0 8px 32px rgba(0,0,0,.35)}
.cbox textarea{width:100%;border:0;background:none;outline:0;resize:none;max-height:200px;min-height:32px;font:14px/1.6 Inter,sans-serif;color:var(--tx)}
.cbox textarea::placeholder{font:13.5px Inter,sans-serif;color:var(--tx3)}
.tools{display:flex;align-items:center;gap:6px;margin-top:6px}.tools .sp{flex:1}
.attach-label{font:9px 'JetBrains Mono',monospace;color:var(--tx3);letter-spacing:1px}
.mic-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--tx2);transition:all .15s ease}
.mic-btn:hover{background:var(--elev);color:var(--tx)}
.mic-btn:active{transform:scale(.94)}
.mic-btn.recording{color:#f43f5e;background:rgba(244,63,94,.15);border:1px solid #f43f5e;animation:micPulse 1.2s infinite ease-in-out}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 rgba(244,63,94,0);transform:scale(1)}50%{box-shadow:0 0 12px rgba(244,63,94,.5);transform:scale(1.06)}}
.send{width:32px;height:32px;border-radius:8px;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;transition:all .15s ease;cursor:pointer}
.send:hover{background:var(--ach);box-shadow:0 2px 10px rgba(59,130,246,.45)}
.send:active{transform:scale(.94)}
.send:disabled{background:var(--elev);color:var(--tx3);cursor:not-allowed;transform:none;box-shadow:none}
.hint{max-width:840px;margin:8px auto 0;display:flex;justify-content:space-between;font:11px Inter,sans-serif;color:var(--tx3)}
.hint kbd{font:10px 'JetBrains Mono',monospace;background:var(--surf);border:1px solid var(--bd);padding:1px 5px;border-radius:4px;color:var(--tx2)}

/* web toggle & tool cards */
.web-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:14px;color:var(--tx2);background:var(--surf);font:500 11.5px Inter,sans-serif;transition:all .15s ease;cursor:pointer;user-select:none;white-space:nowrap}
.web-btn svg{width:13px;height:13px;color:var(--tx3);transition:color .15s;flex-shrink:0}
.web-btn:hover{background:var(--elev);color:var(--tx);border-color:var(--tx3)}
.web-btn:hover svg{color:var(--tx)}
.web-btn.on{background:rgba(59,130,246,.12);color:var(--ac);border-color:rgba(59,130,246,.4);box-shadow:0 0 10px rgba(59,130,246,.2)}
.web-btn.on svg{color:var(--ac)}
.web-btn:active{transform:scale(.96)}
/* thinking & agentic tool trace (compact accordions) */
details.think, details.tool-trace {
  margin: 10px 0 14px;
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
  transition: all .2s var(--ease);
  width: fit-content;
  max-width: 100%;
}
details.think[open], details.tool-trace[open] {
  width: 100%;
  background: var(--surf);
  border-color: var(--tx3);
}
details.think summary, details.tool-trace summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 500;
  color: var(--tx2);
  cursor: pointer;
  user-select: none;
  list-style: none;
  transition: all .15s ease;
}
details.think summary::-webkit-details-marker,
details.tool-trace summary::-webkit-details-marker {
  display: none;
}
details.think summary:hover,
details.tool-trace summary:hover {
  color: var(--tx);
  background: var(--elev);
}
.think-icon {
  display: inline-flex;
  align-items: center;
  color: var(--tx2);
  flex-shrink: 0;
}
.think-icon svg {
  width: 14px;
  height: 14px;
}
.think-icon.running svg {
  color: var(--ac);
  animation: micPulse 1.2s infinite ease-in-out;
}
.think-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  letter-spacing: -0.01em;
}
.think-chevron {
  display: inline-flex;
  align-items: center;
  color: var(--tx3);
  transition: transform .2s var(--ease);
  flex-shrink: 0;
}
.think-chevron svg {
  width: 13px;
  height: 13px;
}
details[open] .think-chevron svg {
  transform: rotate(180deg);
  color: var(--tx);
}

/* inside expanded body */
.think-body {
  padding: 11px 13px;
  border-top: 1px solid var(--bd);
  background: var(--bg2);
  font-size: 12px;
  line-height: 1.6;
}
details.think .think-body {
  color: var(--tx2);
  white-space: pre-wrap;

/* attachments */

.pane{padding:16px 20px;overflow:auto;flex:1}.set{padding:12px 0;border-bottom:1px solid var(--bd)}.set:last-child{border:0}
.set label{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:500}.set small{color:var(--tx3);display:block;font-weight:400;font-size:11px;margin-top:4px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1c1e26;color:#f8fafc;border:1px solid #2e3240;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:8px 16px;z-index:60;font:500 12px Inter,sans-serif;animation:rise .2s var(--ease)}
.pop{position:absolute;z-index:30;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:4px;min-width:200px;animation:pop .15s var(--ease)}

/* live compute & loading indicators */

const Axom={
  connected:false,
  url:p=>(S.api||'')+p,
  async models(){
    try{
      const r=await fetch(Axom.url('/api/models'));
      if(!r.ok)throw 0;
      Axom.connected=true;
      const data=await r.json();
      const list = Array.isArray(data) ? data : (data.data || data.models || []);
      return list.map(m=>typeof m === 'string' ? { id: m, name: (m==='axom:1.1'||m==='axom:latest') ? 'Axom v1.1' : m } : m);

  async*stream({messages,signal}){
    let r;
    const effortParams = S.effort === 'light' 
      ? { max_tokens: 180, top_k: 20, temperature: 0.5 }
      : S.effort === 'deep' 
      ? { max_tokens: 1024, top_k: 80, temperature: 0.8 }
      : { max_tokens: 512, top_k: 50, temperature: 0.7 };

    try{
      r=await fetch(Axom.url('/api/chat'),{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal,
        body:JSON.stringify({
          model:S.model,
          session_id:S.cur||'default_session',
          web_search: S.web !== false,
          web_mode: S.web === false ? 'offline' : 'auto',
          messages:messages.map(m=>({role:m.role,content:m.ctx?m.ctx+'\n\n'+m.text:m.text})),
          params:{...S.gen, ...effortParams, stop:String(S.gen.stop||'').split(',').map(x=>x.trim()).filter(Boolean), stream: true}
        })
      });
    }catch(e){if(e.name==='AbortError')throw e;throw new Error('Unable to connect to the Axom backend.')}
    if(!r.ok){const error=await r.json().catch(()=>null);throw new Error(error?.error||'Backend error '+r.status)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        const line=chunk.split('\n').find(l=>l.startsWith('data:'));if(!line)continue;
        const ev=JSON.parse(line.slice(5));if(ev.type==='error')throw new Error(ev.message);if(ev.type==='done'||ev.done)return;yield ev;
      }
    }
  }
};

const RagApi = {
  async getDocuments() {
    try {
      const r = await fetch(Axom.url('/api/rag/documents'));
      if (!r.ok) return [];
      const d = await r.json();
      return d.documents || [];
    } catch(e) {
      console.warn('RAG getDocuments error:', e);
      return [];
    }
  },
  async upload(files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    const r = await fetch(Axom.url('/api/rag/upload'), {
      method: 'POST',
      body: fd
    });
    return r.json();
  },
  async delete(filename) {
    const r = await fetch(Axom.url('/api/rag/delete'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename })
    });
    return r.json();
  },
  async reindex() {
    const r = await fetch(Axom.url('/api/rag/ingest'), {
      method: 'POST'
    });
    return r.json();
  },
  async* streamChat({ query, messages, signal }) {
    const r = await fetch(Axom.url('/api/rag/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal,
      body: JSON.stringify({
        messages: messages.map(m => ({ role: m.role, content: m.text })),
        stream: true,
        top_k: 4
      })
    });
    if (!r.ok) {
      const err = await r.json().catch(() => null);
      throw new Error(err?.error || 'RAG backend error ' + r.status);
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = chunk.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === 'error') throw new Error(ev.message);
        if (ev.type === 'done' || ev.done) return;
        yield ev;
      }
    }
  }
};

/* ---- markdown parser with full table support & clean code blocks ---- */
function inline(t){
  t=esc(t);
  t=t.replace(/\[doc:([^\]#]+)(?:#(\d+))?\]/g, (match, doc, chunk) => {
    return `<span class="inline-cit" data-doc="${doc}" data-chunk="${chunk||0}" title="View source passage">${doc}${chunk ? ' #' + chunk : ''}</span>`;
  });
  return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src){
  const h=[];
  src.split(/```/).forEach((p,i)=>{
    if(i%2){
      const nl=p.indexOf('\n'),lang=(nl<0?p:p.slice(0,nl)).trim(),code=nl<0?'':p.slice(nl+1);
      const isHtml = ['html','htm'].includes(lang.toLowerCase()) || /<!DOCTYPE html|<html[\s>]/i.test(code);
      const previewBtn = isHtml ? `<button class="btn-preview" data-act="openpreview" title="${t('previewInBrowser')}">${ic('globe')} <span>${t('previewBtn')}</span></button>` : '';
      const saveBtn = `<button class="btn-copy" data-act="saveworkspace" title="${t('saveToWorkspace')}">${ic('save')} <span>${t('saveBtn')}</span></button>`;
      const dlBtn = `<button class="btn-copy" data-act="downloadcode" title="${t('downloadFile')}">${ic('download')} <span>${t('downloadBtn')}</span></button>`;
      h.push(`<div class="cb"><header><span class="cb-tag">${ic('code')} ${esc(lang||'text')}</span><div class="cb-actions">${previewBtn}${saveBtn}${dlBtn}<button class="btn-copy" data-act="copycode">${ic('copy')} <span>${t('copy')}</span></button></div></header><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`);
      return;
    }
    const lines = p.split('\n');
    let lineIdx = 0;
    let list = null;
    const closeList = () => { if(list) { h.push(`</${list}>`); list = null; } };

    while (lineIdx < lines.length) {
      const l = lines[lineIdx];

      // Markdown Table: line has '|' and next line is standard divider '| --- | --- |'
      if (l.includes('|') && lineIdx + 1 < lines.length && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(lines[lineIdx + 1].trim())) {
        closeList();
        const parseRow = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const headers = parseRow(l);
        lineIdx += 2;
        const tableRows = [];
        while (lineIdx < lines.length && lines[lineIdx].includes('|') && lines[lineIdx].trim() !== '') {
          tableRows.push(parseRow(lines[lineIdx]));
          lineIdx++;
        }
        let tbl = '<div class="table-wrap"><table><thead><tr>' + headers.map(th => `<th>${inline(th)}</th>`).join('') + '</tr></thead><tbody>';
        for (const row of tableRows) {
          if (row.length === 1 && !row[0]) continue;
          tbl += '<tr>' + row.map(td => `<td>${inline(td)}</td>`).join('') + '</tr>';
        }
        tbl += '</tbody></table></div>';
        h.push(tbl);
        continue;
      }

      let m;
      if (m = l.match(/^[-*]\s+(.*)/)) {
        if (list !== 'ul') { closeList(); h.push('<ul>'); list = 'ul'; }
        h.push(`<li>${inline(m[1])}</li>`);
      } else if (m = l.match(/^\d+\.\s+(.*)/)) {
        if (list !== 'ol') { closeList(); h.push('<ol>'); list = 'ol'; }
        h.push(`<li>${inline(m[1])}</li>`);
      } else {
        closeList();
        if (m = l.match(/^(#{1,4})\s+(.*)/)) {
          h.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`);
        } else if (m = l.match(/^>\s?(.*)/)) {
          h.push(`<blockquote>${inline(m[1])}</blockquote>`);
        } else if (l.trim()) {
          h.push(`<p>${inline(l)}</p>`);
        }
      }
      lineIdx++;
    }
    closeList();
  });
  return h.join('');
}

  init(){
    window.addEventListener('message', ev => {
      if(ev.data && (ev.data.act === 'browserNavigated' || ev.data.act === 'browserLoaded')){
        if(ev.data.url){
          InsideBrowser.currentUrl = ev.data.url;
          const input = $('#ibUrlInput');
          if(input && document.activeElement !== input) input.value = ev.data.url;
          try {
            const host = new URL(ev.data.url).hostname;
            InsideBrowser.currentTitle = ev.data.title || host;
            const tabTitle = $('#ibTabTitle');
            if(tabTitle) tabTitle.textContent = InsideBrowser.currentTitle;
          } catch(e){}
        }
      }
    });
  },

  navigate(rawInput){
    if(!rawInput) return;
    let input = rawInput.trim();
    let url = '';
    if(input.startsWith('data:') || input.startsWith('blob:')){
      url = input;
    } else if(/^https?:\/\//i.test(input)){
      url = input;
    } else if(/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(input) || input.includes('localhost:') || input.includes('127.0.0.1:')){
      url = 'https://' + input;
    } else {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(input);
    }
    this.currentUrl = url;
    try {
      this.currentTitle = url.startsWith('data:') ? 'Custom Page' : new URL(url).hostname;
    } catch(e){
      this.currentTitle = 'Web';
    }
    const inputEl = $('#ibUrlInput');
    if(inputEl) inputEl.value = url;
    const tabTitle = $('#ibTabTitle');
    if(tabTitle) tabTitle.textContent = this.currentTitle;
    const frame = $('#ibFrame');
    if(frame){
      if(url.startsWith('data:')){
        frame.src = url;
      } else {
        frame.src = '/api/browser/proxy?url=' + encodeURIComponent(url);
      }
    }
  },

  open(url){
    this.isOpen = true;
    const app = $('#app');
    if(app) app.classList.add('browser-open');
    this.navigate(url || this.currentUrl || 'https://www.google.com');
  },

  close(){
    this.isOpen = false;
    this.isMaximized = false;
    const app = $('#app');
    if(app) app.classList.remove('browser-open');
    const panel = $('#insideBrowser');
    if(panel) panel.classList.remove('maximized');
  },

  toggle(){
    if(this.isOpen) this.close();
    else this.open(this.currentUrl || 'https://www.google.com');
  },

  toggleMaximize(){
    this.isMaximized = !this.isMaximized;
    const panel = $('#insideBrowser');
    if(panel) panel.classList.toggle('maximized', this.isMaximized);
    const maxBtn = $('#ibMaxBtn');
    if(maxBtn) maxBtn.innerHTML = ic(this.isMaximized ? 'shrink' : 'expand');
  },

  back(){
    try { $('#ibFrame')?.contentWindow?.history.back(); } catch(e){}
  },

  forward(){
    try { $('#ibFrame')?.contentWindow?.history.forward(); } catch(e){}
  },

  reload(){
    const frame = $('#ibFrame');
    if(!frame) return;
    if(this.currentUrl.startsWith('data:')){
      frame.src = this.currentUrl;
    } else {
      frame.src = '/api/browser/proxy?url=' + encodeURIComponent(this.currentUrl);
    }
  },

  home(){
    this.navigate('https://www.google.com');
  },

  openNewTab(){
    window.open(this.currentUrl || 'https://www.google.com', '_blank');
  },

  render(){
    const tabTitle = $('#ibTabTitle');
    if(tabTitle) tabTitle.textContent = this.currentTitle || 'Google';
    const urlInput = $('#ibUrlInput');
    if(urlInput) urlInput.value = this.currentUrl || 'https://www.google.com';
    const frame = $('#ibFrame');
    if(frame && !frame.src){
      frame.src = '/api/browser/proxy?url=' + encodeURIComponent(this.currentUrl || 'https://www.google.com');
    }
  }
};

function drawRagVault(){
  const el = $('#ragDocList');
  const summaryEl = $('#ragVaultSummary');
  const sideCountEl = $('#ragSideCount');
  if(!el) return;

  const totalChunks = ragDocs.reduce((acc, d) => acc + (d.chunks_count || 0), 0);
  if(summaryEl) summaryEl.textContent = `${ragDocs.length} Docs · ${totalChunks} Chunks`;
  if(sideCountEl) sideCountEl.textContent = `${ragDocs.length} ${t('ragDocsCount').replace('{n}', ragDocs.length)}`;

  if(!ragDocs.length){
    el.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--tx3);font-size:11.5px;font-family:'JetBrains Mono',monospace">${t('ragNoDocs')}</div>`;
    return;
  }

  el.innerHTML = ragDocs.map(d => {
    const ext = d.filename.split('.').pop().toLowerCase();
    const sizeKb = (d.size_bytes / 1024).toFixed(1);
    const iconCls = ['pdf','md','txt'].includes(ext) ? ext : 'txt';
    return `<div class="rag-doc-card">
      <div class="rag-doc-icon ${iconCls}">${ext}</div>
      <div class="rag-doc-info">
        <div class="rag-doc-name" title="${esc(d.filename)}">${esc(d.filename)}</div>
        <div class="rag-doc-sub">
          <span>${sizeKb} KB</span>
          <span class="rag-doc-chunks">${d.chunks_count || 0} chunks</span>
        </div>
      </div>
      <button class="rag-doc-del" data-act="ragdel" data-file="${esc(d.filename)}" title="${t('del')}">${ic('trash')}</button>
    </div>`;
  }).join('');
}

function renderCitationsBarHTML(citations){
  if(!citations || !citations.length) return '';
  return citations.map(c => {
    const scorePct = Math.round((c.score || 0) * 100);
    const docShort = c.doc || c.filename || 'document';
    const chunkId = c.chunk_id !== undefined ? c.chunk_id : (c.chunk_index !== undefined ? c.chunk_index : 0);
    const denseVal = Math.round(((c.dense_score !== undefined ? c.dense_score : c.vector_score) || 0) * 100);
    const lexVal = Math.round((c.lexical_score || 0) * 100);
    return `<button class="rag-cit-chip" data-act="inspectchunk" data-doc="${esc(docShort)}" data-chunk="${chunkId}" data-score="${scorePct}" data-dense="${denseVal}" data-lex="${lexVal}" data-text="${esc(c.text||'')}">
      ${ic('file')}
      <span>${esc(docShort)} #${chunkId}</span>
      <span class="rag-cit-score">${scorePct}%</span>
    </button>`;
  }).join('');
}

function drawRagMsgs(){
  const el = $('#ragMsgs');
  if(!el) return;

  if(!S.ragMsgs.length){
    el.innerHTML = ragEmptyHTML();
    return;
  }

  el.innerHTML = S.ragMsgs.map((m, i) => {
    if(m.role === 'user'){
      return `<div class="rag-msg user">
        <div class="rag-msg-author">${t('you')}</div>
        <div class="rag-msg-bubble">${esc(m.text)}</div>
      </div>`;
    }
    const isLive = ragRun && (i === S.ragMsgs.length - 1);
    const citationsHtml = renderCitationsBarHTML(m.citations);
    const loadingHtml = isLive && !m.text ? `<div class="compute-loading"><svg class="spin-circle" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.25" fill="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg><span>Searching knowledge vault...</span></div>` : '';

    return `<div class="rag-msg assistant" data-i="${i}">
      <div class="rag-msg-author">${t('axom')} · GROUNDED</div>
      ${citationsHtml ? `<div class="rag-citations-bar">${citationsHtml}</div>` : ''}
      ${loadingHtml}
      <div class="rag-msg-content">${md(m.text)}</div>
      ${isLive ? '' : `<div class="rag-msg-actions"><button class="ib" data-act="copyrag" data-i="${i}" title="${t('copy')}">${ic('copy')}</button></div>`}
    </div>`;
  }).join('');
  scrollRagEnd();
}

const scrollRagEnd = () => { const c = $('#ragMsgs'); if(c) c.scrollTop = c.scrollHeight; };

function updRagSend(){
  const b = $('#ragSend');
  const i = $('#ragInp');
  if(!b) return;
  if(ragRun){
    b.innerHTML = ic('stop');
    b.dataset.act = 'ragstop';
    b.disabled = false;
  } else {
    b.innerHTML = ic('up');
    b.dataset.act = 'ragsend';
    b.disabled = !(i && i.value.trim());
  }
}

function bindRagStudio(){
  const inp = $('#ragInp');
  const fileInp = $('#ragFileInput');
  const dropzone = $('#ragDropzone');

  if(inp){
    inp.addEventListener('input', () => {
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 180) + 'px';
      updRagSend();
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
        e.preventDefault();
        if(!ragRun) sendRag();
      }
    });
  }

  if(fileInp){
    fileInp.addEventListener('change', async () => {
      if(fileInp.files && fileInp.files.length){
        await uploadRagFiles(fileInp.files);
        fileInp.value = '';
      }
    });
  }

  if(dropzone){
    dropzone.addEventListener('dragover', e => {
      e.preventDefault();
      dropzone.classList.add('drag');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', async e => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      if(e.dataTransfer.files && e.dataTransfer.files.length){
        await uploadRagFiles(e.dataTransfer.files);
      }
    });
  }
}

async function uploadRagFiles(files){
  toast(t('ragReindexing'));
  try{
    const res = await RagApi.upload(files);
    if(res.documents){
      ragDocs = res.documents;
      drawRagVault();
      toast(t('ragDocUploaded'));
    } else {
      await loadRagDocs();
      toast(t('ragDocUploaded'));
    }
  }catch(e){
    toast('Upload failed: ' + e.message);
  }
}

async function loadRagDocs(){
  ragDocs = await RagApi.getDocuments();
  drawRagVault();
}

async function sendRag(prompt){
  const inp = $('#ragInp');
  prompt = (prompt != null ? prompt : (inp ? inp.value : '')).trim();
  if(!prompt || ragRun) return;

  if(inp){
    inp.value = '';
    inp.style.height = 'auto';
  }

  S.ragMsgs.push({ role: 'user', text: prompt });
  const asstMsg = { role: 'assistant', text: '', citations: [] };
  S.ragMsgs.push(asstMsg);
  save();
  drawRagMsgs();

  ragRun = new AbortController();
  updRagSend();

  const msgEls = $$('.rag-msg.assistant', $('#ragMsgs'));
  const targetMsgEl = msgEls[msgEls.length - 1];
  const bodyEl = targetMsgEl?.querySelector('.rag-msg-content');

  try{
    const msgsToSend = S.ragMsgs.slice(0, -1);
    for await (const ev of RagApi.streamChat({ query: prompt, messages: msgsToSend, signal: ragRun.signal })){
      if(ev.type === 'citations'){
        asstMsg.citations = ev.citations || [];
        const citBar = targetMsgEl?.querySelector('.rag-citations-bar') || (() => {
          const div = document.createElement('div');
          div.className = 'rag-citations-bar';
          targetMsgEl.insertBefore(div, targetMsgEl.querySelector('.compute-loading') || bodyEl);
          return div;
        })();
        citBar.innerHTML = renderCitationsBarHTML(asstMsg.citations);
      } else if(ev.text){
        const loadEl = targetMsgEl?.querySelector('.compute-loading');
        if(loadEl) loadEl.remove();
        asstMsg.text += ev.text;
        if(bodyEl) bodyEl.innerHTML = md(asstMsg.text);
        scrollRagEnd();
      }
    }
  }catch(e){
    if(e.name === 'AbortError'){
      asstMsg.text += '\n\n' + t('genStopped');
    } else {
      asstMsg.text += '\n\n' + (e.message || 'Error communicating with RAG server.');
    }
    if(bodyEl) bodyEl.innerHTML = md(asstMsg.text);
  }finally{
    ragRun = null;
    save();
    drawRagMsgs();
    updRagSend();
  }
}

function toolsTraceHTML(tools, isOpen=false){
  if(!tools||!tools.length) return '';
  const isRunning = tools.some(x=>x.status==='running');
  const runningTool = tools.find(x=>x.status==='running');

  const sourcesMap = new Map();
  const searches = [];

  for(const tObj of tools){
    if(tObj.name==='search_web'){
      const q = tObj.args?.query || '';
      searches.push({ type: 'search', text: q, isRunning: tObj.status==='running' });
      const results = tObj.result?.results || [];
      for(const r of results){
        if(r && r.url && !sourcesMap.has(r.url)){
          sourcesMap.set(r.url, r);
        }
      }
    }else if(tObj.name==='academic_search'){
      const q = tObj.args?.query || '';
      searches.push({ type: 'academic', text: q, isRunning: tObj.status==='running' });
      const papers = tObj.result?.papers || [];
      for(const p of papers){
        const link = p.pdf_url || p.url;
        if(link && !sourcesMap.has(link)){
          sourcesMap.set(link, { title: `${p.citation_key ? '['+p.citation_key+'] ' : ''}${p.title} (${p.year})`, url: link });
        }
      }
    }else if(tObj.name==='evaluate_research_gap'){
      searches.push({ type: 'gap', text: tObj.args?.topic || '3-Gate Gap Dossier', isRunning: tObj.status==='running' });
    }else if(tObj.name==='create_design_brief'){
      searches.push({ type: 'design', text: tObj.args?.research_question || 'Socratic Design Brief', isRunning: tObj.status==='running' });
    }else if(tObj.name==='build_literature_matrix'){
      searches.push({ type: 'matrix', text: 'Literature Triage Matrix', isRunning: tObj.status==='running' });
    }else if(tObj.name==='conduct_paper_review'){
      searches.push({ type: 'review', text: 'Scientific Peer Review', isRunning: tObj.status==='running' });
    }else if(tObj.name==='generate_bibtex'){
      searches.push({ type: 'bibtex', text: tObj.args?.title || 'BibTeX Citation', isRunning: tObj.status==='running' });
    }else if(tObj.name==='browse_page'){
      searches.push({ type: 'browse', text: tObj.args?.url || '', isRunning: tObj.status==='running' });
    }else if(tObj.name==='open_browser'){
      searches.push({ type: 'browser', text: tObj.args?.url || '', isRunning: tObj.status==='running' });
    }else{
      searches.push({ type: 'tool', text: tObj.name, isRunning: tObj.status==='running' });
    }
  }

  const uniqueSources = Array.from(sourcesMap.values());

  let summaryTitle = '';
  if(isRunning && runningTool){
    if(runningTool.name==='search_web'){
      summaryTitle = runningTool.args?.query ? `${t('toolSearching')} "${runningTool.args.query}"` : t('toolSearching');
    }else if(runningTool.name==='academic_search'){
      summaryTitle = runningTool.args?.query ? `${t('toolAcademicSearching')} "${runningTool.args.query}"` : t('toolAcademicSearching');
    }else if(runningTool.name==='evaluate_research_gap'){
      summaryTitle = t('toolEvaluatingGap');
    }else if(runningTool.name==='create_design_brief'){
      summaryTitle = t('toolCreatingDesignBrief');
    }else if(runningTool.name==='build_literature_matrix'){
      summaryTitle = t('toolBuildingMatrix');
    }else if(runningTool.name==='conduct_paper_review'){
      summaryTitle = t('toolConductingReview');
    }else if(runningTool.name==='browse_page'){
      summaryTitle = t('toolReadingPage');
    }else if(runningTool.name==='open_browser'){
      summaryTitle = t('toolOpeningBrowser');
    }else{
      summaryTitle = t('thinking');
    }
  }else{
    if(uniqueSources.length === 1){
      summaryTitle = t('searchedSourceSingle');
    }else if(uniqueSources.length > 1){
      summaryTitle = t('searchedSources').replace('{n}', uniqueSources.length);
    }else{
      summaryTitle = t('searchedWeb');
    }
  }

  let searchesHTML = '';
  if(searches.length){
    searchesHTML = `<div class="trace-section"><div class="trace-section-title">${ic('search')} ${t('traceSearches')}</div><div class="trace-list">` +
      searches.map(s=>{
        if(s.type==='search'){
          return `<div class="trace-item">${ic('search')}<span>${t('searchQueryLabel')} <span class="trace-query">"${esc(s.text)}"</span></span></div>`;
        }else if(s.type==='academic'){
          return `<div class="trace-item">${ic('book')}<span>${t('academicSearchLabel')} <span class="trace-query">"${esc(s.text)}"</span></span></div>`;
        }else if(s.type==='gap' || s.type==='design' || s.type==='matrix' || s.type==='review'){
          return `<div class="trace-item">${ic('clipboard')}<span>${esc(s.text)}</span></div>`;
        }else if(s.type==='browse'){
          return `<div class="trace-item">${ic('file')}<span>${t('readPageLabel')} <span class="trace-query">${esc(s.text)}</span></span></div>`;
        }else if(s.type==='browser'){
          return `<div class="trace-item">${ic('globe')}<span>${t('openedBrowserLabel')} <span class="trace-query">${esc(s.text)}</span></span></div>`;
        }else{
          return `<div class="trace-item">${ic('code')}<span>${esc(s.text)}</span></div>`;
        }
      }).join('') +
      `</div></div>`;
  }

  let sourcesHTML = '';
  if(uniqueSources.length){
    sourcesHTML = `<div class="trace-section"><div class="trace-section-title">${ic('clip')} ${t('traceSources')}</div><div class="trace-sources">` +
      uniqueSources.map(r=>{
        return `<a href="${esc(r.url)}" class="trace-source-chip" data-act="openinbrowser" data-url="${esc(r.url)}" title="${esc(r.title||r.url)}">${ic('ext')}<span class="trace-source-title">${esc(r.title||r.url)}</span></a>`;
      }).join('') +
      `</div></div>`;
  }

  const iconHtml = isRunning
    ? `<svg class="spin-circle" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.25" fill="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>`
    : ic('globe');

  return `<details class="tool-trace think-trace"${isOpen?' open':''}>
    <summary class="think-summary">
      <span class="think-icon ${isRunning?'running':''}">${iconHtml}</span>
      <span class="think-title">${esc(summaryTitle)}</span>
      <span class="think-chevron">${ic('chevron')}</span>
    </summary>
    <div class="think-body">
      ${searchesHTML}
      ${sourcesHTML}
    </div>
  </details>`;
}

/* ---- file & folder recursive scanner ---- */
async function scanFiles(items) {
  const fileList = [];
  async function traverse(item) {
    if (item.isFile) {
      await new Promise(res => item.file(f => { fileList.push(f); res(); }));
    } else if (item.isDirectory) {
      const reader = item.createReader();
      const entries = await new Promise(res => reader.readEntries(res));
      for (const entry of entries) {
        if (!entry.name.startsWith('.') && entry.name !== 'node_modules') {
          await traverse(entry);
        }
      }
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) await traverse(entry);
    else if (item.getAsFile) { const f = item.getAsFile(); if (f) fileList.push(f); }
  }
  return fileList;
}

async function addFiles(list){
  for(const f of list){
    if(atts.length>=10){toast(t('maxFiles'));break}
    if(f.size>25e6){toast(f.name+' '+t('fileExceeds'));continue}
    const dotIdx = f.name.lastIndexOf('.');
    const ext = dotIdx !== -1 ? f.name.slice(dotIdx).toLowerCase() : '';
    const isImg = f.type.startsWith('image/') || ['.png','.jpg','.jpeg','.webp','.gif','.bmp','.svg'].includes(ext);
    const isPdf = f.type === 'application/pdf' || ext === '.pdf';

    if(isImg){
      const dataUrl = await new Promise(res => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(f);
      });
      atts.push({ name: f.name, type: 'image', data: dataUrl, ext, isImg: true });
    } else if(isPdf){
      const dataUrl = await new Promise(res => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(f);
      });
      atts.push({ name: f.name, type: 'pdf', data: dataUrl, ext, isPdf: true });
    } else {
      let tText = '';
      try { tText = await f.text(); } catch(e){}
      if(tText && !tText.includes('\0')){
        if(tText.length>MAXF){tText=tText.slice(0,MAXF);toast(f.name+' '+t('fileTrimmed'))}
        atts.push({ name: f.name, type: 'text', text: tText, ext });
      } else {
        const dataUrl = await new Promise(res => {
          const reader = new FileReader();
          reader.onload = () => res(reader.result);
          reader.readAsDataURL(f);
        });
        atts.push({ name: f.name, type: 'binary', data: dataUrl, ext });
      }
    }
  }
  drawAtts();updSend();
}

function drawAtts(){
  const e=$('#atts');if(!e)return;
  e.innerHTML=atts.map((f,i)=>{
    if(f.isImg){
      return `<span class="chip"><img src="${f.data}" class="chip-thumb" alt="${esc(f.name)}"><span>${esc(f.name)}</span><button class="ib x" data-act="rmfile" data-i="${i}" aria-label="Remove ${esc(f.name)}">${ic('x')}</button></span>`;
    }
    if(f.isPdf){
      return `<span class="chip"><span class="chip-badge">PDF</span><span>${esc(f.name)}</span><button class="ib x" data-act="rmfile" data-i="${i}" aria-label="Remove ${esc(f.name)}">${ic('x')}</button></span>`;
    }
    return `<span class="chip">${ic('file')}<span>${esc(f.name)}</span><button class="ib x" data-act="rmfile" data-i="${i}" aria-label="Remove ${esc(f.name)}">${ic('x')}</button></span>`;
  }).join('');
}

function bindInput(){
  const i=$('#inp'),box=$('#cbox'),fi=$('#file');
  i.addEventListener('input',()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,200)+'px';updSend()});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&(S.enterSends?!e.shiftKey:e.ctrlKey)){e.preventDefault();if(!run)send()}});
  i.addEventListener('paste',e=>{if(e.clipboardData.files.length){e.preventDefault();addFiles(e.clipboardData.files)}});
  fi.addEventListener('change',()=>{addFiles(fi.files);fi.value=''});
  box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag')});
  box.addEventListener('dragleave',()=>box.classList.remove('drag'));
  box.addEventListener('drop',async e=>{
    e.preventDefault();
    box.classList.remove('drag');
    if (e.dataTransfer.items) {
      const scanned = await scanFiles(e.dataTransfer.items);
      if (scanned.length) addFiles(scanned);
      else addFiles(e.dataTransfer.files);
    } else {
      addFiles(e.dataTransfer.files);
    }
  });
  let tTimeout;$('#q').addEventListener('input',e=>{clearTimeout(tTimeout);tTimeout=setTimeout(()=>{query=e.target.value;$('#list').innerHTML=sideHTML()},120)});
}

/* ---- chat flow ---- */
function newChat(){
  S.cur = null;
  save();
  atts = [];
  shell();
  focusInput();
  closeDrawer();
}

async function send(text){
  const i = $('#inp');
  text = (text ?? (i ? i.value : ''));
  if((!text.trim() && !atts.length)) return;

  let c = cur();
  if(!c){
    c = { id:'c'+Date.now(), title:text.slice(0,40)||atts[0]?.name||t('newConvHeader'), ts:Date.now(), msgs:[] };
    S.convs.push(c);
    S.cur = c.id;
  }

  // If this conversation was already generating, cancel its previous run cleanly before starting new turn
  if(activeRuns.has(c.id)){
    activeRuns.get(c.id).controller.abort();
    activeRuns.delete(c.id);
  }

  const currentAtts = [...atts];
  atts = [];
  if(i){
    i.value = '';
    i.style.height = 'auto';
  }
  drawAtts();
  updSend();
  focusInput();

  let parsedCtx = [];
  const filesToParse = currentAtts.filter(f => f.data);
  if(filesToParse.length > 0){
    toast(t('fileParsing'));
    try {
      const pRes = await fetch('/api/files/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          files: filesToParse.map(f => ({ name: f.name, data: f.data, type: f.type })),
          prompt: text
        })
      });
      if(pRes.ok){
        const pData = await pRes.json();
        if(pData.results) parsedCtx = pData.results;
      }
    } catch(err){
      console.warn('File parse error:', err);
    }
  }

  const ctxParts = [];
  for(const f of currentAtts){
    if(f.text){
      ctxParts.push(`[File: ${f.name}]\n${f.text}`);
    } else {
      const match = parsedCtx.find(p => p.name === f.name);
      if(match && match.content){
        ctxParts.push(match.content);
      } else {
        ctxParts.push(`[Attached file: ${f.name}]`);
      }
    }
  }

  c.msgs.push({ role:'user', text, files:currentAtts.map(f=>f.name), ctx:ctxParts.join('\n\n') });
  c.ts = Date.now();
  fresh = c.msgs.length - 1;
  if(S.cur === c.id) drawMsgs();
  fresh = -1;
  focusInput();
  generate(c);
}

/* Multi-tasking background generation */
async function generate(c){
  const m = { role:'assistant', text:'', think:'', thinkMs:0, tools:[] };
  c.msgs.push(m);
  const controller = new AbortController();
  activeRuns.set(c.id, { controller, msg: m });
  const t0 = Date.now();

  if(S.cur === c.id){
    fresh = c.msgs.length - 1;
    drawMsgs();
    fresh = -1;
    updSend();
    focusInput();
  }
  updateSidebarLiveDots();

  let raf = 0;
  const paint = () => {
    raf = 0;
    if(S.cur !== c.id) return;

    const msgEl = $('.msg:last-child', $('#msgs'));
    if(!msgEl) return;
    const el = $('.bd', msgEl);
    if(!el) return;
    el.classList.add('live');

    if(S.showThinking && m.think){
      let thinkEl = $('.think', msgEl);
      if(!thinkEl){
        thinkEl = document.createElement('details');
        thinkEl.className = 'think think-trace';
        msgEl.insertBefore(thinkEl, el);
      }
      const wasOpen = thinkEl.hasAttribute('open');
      thinkEl.innerHTML = `<summary class="think-summary"><span class="think-icon">${ic('code')}</span><span class="think-title">${t('thinking')} · ${(m.thinkMs/1e3).toFixed(1)}s</span><span class="think-chevron">${ic('chevron')}</span></summary><div class="think-body">${esc(m.think)}</div>`;
      if(wasOpen) thinkEl.setAttribute('open', '');
    }
    if(m.tools && m.tools.length){
      let tContainer = $('.tools-wrap', msgEl);
      if(!tContainer){
        tContainer = document.createElement('div');
        tContainer.className = 'tools-wrap';
        msgEl.insertBefore(tContainer, el);
      }
      const existingDetails = tContainer.querySelector('details');
      const wasOpen = existingDetails ? existingDetails.hasAttribute('open') : false;
      tContainer.innerHTML = toolsTraceHTML(m.tools, wasOpen);
    }
    let loadEl = $('.compute-loading', msgEl);
    if (!m.text) {
      if (!loadEl) {
        loadEl = document.createElement('div');
        loadEl.className = 'compute-loading';
        loadEl.innerHTML = `<svg class="spin-circle" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.25" fill="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg><span>${t('thinking')}...</span>`;
        msgEl.insertBefore(loadEl, el);
      }
    } else {
      if (loadEl) loadEl.remove();
    }
    el.innerHTML = md(m.text);
    scrollEnd();
  };

  try {
    for await (const ev of Axom.stream({ messages: c.msgs.slice(0, -1), signal: controller.signal })) {
      if(ev.type === 'tool_start'){
        m.tools.push({ id: ev.id, name: ev.name, args: ev.args, status: 'running' });
        if(!raf) raf = requestAnimationFrame(paint);
      } else if(ev.type === 'tool_end'){
        const tObj = m.tools.find(x => x.id === ev.id) || m.tools.find(x => x.status === 'running') || m.tools.at(-1);
        if(tObj){ tObj.status = 'done'; tObj.result = ev.result; }
        if(!raf) raf = requestAnimationFrame(paint);
      } else if(ev.type === 'think'){
        m.think += (ev.text || '');
        m.thinkMs = Date.now() - t0;
      } else {
        const chunk = ev.text || ev.token || '';
        if(chunk){
          m.text += chunk;
          if(!raf) raf = requestAnimationFrame(paint);
        }
      }
    }
  } catch(e) {
    if(e.name === 'AbortError'){
      m.text += m.text ? '\n\n' + t('genStopped') : t('genStopped');
    } else {
      m.err = e.message || t('genStoppedUnexpected');
    }
  }

  if(raf) cancelAnimationFrame(raf);
  activeRuns.delete(c.id);
  save();
  updateSidebarLiveDots();
  if(S.cur === c.id){
    drawMsgs();
    updSend();
    focusInput();
  }
}

/* ---- voice dictation (speech-to-text) ---- */
let recognition = null, isRecording = false;

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast(t('voiceNotSupported'));
    return;
  }
  const micBtn = $('#micBtn'), inp = $('#inp');
  if (isRecording) {
    if (recognition) {
      try { recognition.stop(); } catch(e){}
    }
    isRecording = false;
    micBtn?.classList.remove('recording');
    toast(t('voiceStopped'));
    return;
  }

  try {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = S.lang === 'pt' ? 'pt-PT' : 'en-US';

    let baseText = inp.value ? inp.value.trim() + ' ' : '';

    recognition.onstart = () => {
      isRecording = true;
      micBtn?.classList.add('recording');
      toast(t('voiceListening'));
    };

    recognition.onresult = (e) => {
      let interim = '';
      for (let idx = e.resultIndex; idx < e.results.length; idx++) {
        const transcript = e.results[idx][0].transcript;
        if (e.results[idx].isFinal) {
          baseText += transcript + ' ';
        } else {
          interim += transcript;
        }
      }
      inp.value = baseText + interim;
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 200) + 'px';
      updSend();
    };

    recognition.onerror = (e) => {
      console.warn('Voice error:', e.error);
      isRecording = false;
      micBtn?.classList.remove('recording');
      if (e.error !== 'no-speech') {
        toast(t('micError') + e.error);
      }
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn?.classList.remove('recording');
      updSend();
    };

    recognition.start();
  } catch (err) {
    console.error('Failed to start speech recognition:', err);
    isRecording = false;
    micBtn?.classList.remove('recording');
    toast(t('micAccessError'));
  }
}

function popover(anchor,html){closePop();pop=document.createElement('div');pop.className='pop';pop.innerHTML=html;pop.setAttribute('role','menu');document.body.appendChild(pop);
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth;pop.style.top=r.bottom+6+'px';pop.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px'}
function toast(text){const e=document.createElement('div');e.className='toast';e.textContent=text;e.setAttribute('role','status');document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function dialog({title,body='',ok=t('ok'),cancel=t('cancel'),danger,input}){return new Promise(res=>{
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="width:min(420px,100%)"><div class="mh">${esc(title)}</div><div style="padding:16px">${body?`<p style="margin:0 0 10px;color:var(--tx2)">${body}</p>`:''}${input!=null?`<input class="mi" value="${esc(input)}">`:''}</div><div style="display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px"><button class="btn" data-r="0">${cancel}</button><button class="btn ${danger?'dng':'pri'}" data-r="1">${ok}</button></div></div>`;
  document.body.appendChild(o);const inp=$('input',o);(inp||$('[data-r="1"]',o)).focus();inp?.select();
  const done=v=>{o.remove();res(v?(inp?inp.value:true):null)};
  o.addEventListener('click',e=>{if(e.target===o)done(0);const r=e.target.closest('[data-r]');if(r)done(+r.dataset.r)});
  o.addEventListener('keydown',e=>{if(e.key==='Escape')done(0);if(e.key==='Enter'&&inp)done(1)})})}

      fetch('/api/memories').then(r=>r.ok?r.json():[]),
      fetch('/api/training/metrics').then(r=>r.ok?r.json():null),
      fetch('/api/providers').then(r=>r.ok?r.json():{providers:[]})
    ]);
    activeMemories=mRes; trainingMetrics=tRes; activeProviders=pRes?.providers || [];
  }catch(e){}

function renderModelOptions(selectedModel) {
  const list = models.length ? models : [{ id: 'axom:1.1', name: 'Axom v1.1', provider: 'local', providerName: 'AXOM Local Engine' }];
  const groups = {};
  for (const m of list) {
    const pName = m.providerName || (m.provider === 'local' ? 'AXOM Local Engine' : 'Cloud AI Models');
    if (!groups[pName]) groups[pName] = [];
    groups[pName].push(m);
  }
  return Object.entries(groups).map(([groupName, groupModels]) => {
    const opts = groupModels.map(m => {
      const freeTag = m.free_tier_note ? ` [${m.free_tier_note}]` : '';
      return `<option value="${esc(m.id)}" ${m.id === selectedModel ? 'selected' : ''}>${esc(m.name || m.id)}${esc(freeTag)}</option>`;
    }).join('');
    return `<optgroup label="${esc(groupName)}">${opts}</optgroup>`;
  }).join('');
}

  }
  if(e.target.id==='showThinking'){
    S.showThinking=e.target.checked;
    save();
    drawMsgs();
  }
});

/* ---- actions ---- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!e.target.closest('.pop'))closePop();if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,c=cur();
  // Non-blocking multi-tasking: allow navigation anytime
  if(a==='setview'){
    S.view = b.dataset.v || 'chat';
    save();
    if(S.view === 'rag' && !ragDocs.length){
      loadRagDocs();
    }
    shell();
    toast(S.view === 'rag' ? t('navRag') : t('navChat'));
    return;
  }
  else if(a==='ragupload'){
    $('#ragFileInput')?.click();
    return;
  }
  else if(a==='ragreindex'){
    const btn = $('#ragReindexBtn');
    if(btn){
      btn.disabled = true;
      btn.textContent = t('ragReindexing');
    }
    toast(t('ragReindexing'));
    try{
      const r = await RagApi.reindex();
      if(r.documents) ragDocs = r.documents;
      else await loadRagDocs();
      drawRagVault();
      toast(t('ragReindexDone'));
    }catch(err){
      toast('Re-index failed: ' + err.message);
    }finally{
      if(btn){
        btn.disabled = false;
        btn.innerHTML = `${ic('refresh')}<span>${t('ragReindex')}</span>`;
      }
    }
    return;
  }
  else if(a==='ragdel'){
    const file = b.dataset.file;
    if(!file) return;
    if(await dialog({ title: t('delTitle'), body: `"${esc(file)}" ${t('delConfirm')}`, ok: t('del'), danger: 1 })){
      try{
        const r = await RagApi.delete(file);
        if(r.documents) ragDocs = r.documents;
        else await loadRagDocs();
        drawRagVault();
        toast(t('ragDocDeleted'));
      }catch(err){
        toast('Delete failed: ' + err.message);
      }
    }
    return;
  }
  else if(a==='ragclear'){
    S.ragMsgs = [];
    save();
    drawRagMsgs();
    toast(t('ragClearChat'));
    return;
  }
  else if(a==='ragsend'){
    sendRag();
    return;
  }
  else if(a==='ragstop'){
    ragRun?.abort();
    return;
  }
  else if(a==='ragsug'){
    sendRag(b.dataset.q);
    return;
  }
  else if(a==='copyrag'){
    const m = S.ragMsgs[+b.dataset.i];
    if(m && m.text){
      navigator.clipboard.writeText(m.text).then(() => toast(t('copied')), () => toast(t('copyFailed')));
    }
    return;
  }
  else if(a==='inspectchunk'){
    const doc = b.dataset.doc;
    const chunk = b.dataset.chunk;
    const score = b.dataset.score;
    const dense = b.dataset.dense;
    const lex = b.dataset.lex;
    const text = b.dataset.text;
    inspectChunkModal({ doc, chunk, score, dense, lex, text });
    return;
  }
  else if(a==='closeinspect'){
    $('.ov')?.remove();
    return;
  }

  if(a==='gohome'||a==='new')newChat();
  else if(a==='setlang'){
    const targetLang=b.dataset.l;
    if(targetLang && targetLang !== S.lang){
      S.lang = targetLang;
      save();
      shell();
      toast(S.lang === 'pt' ? 'Idioma: Português' : 'Language: English');
    }
  }
  else if(a==='toggleweb'){
    S.web = !S.web;
    save();
    const btn=$('#webBtn');
    if(btn) btn.classList.toggle('on', !!S.web);
    toast(S.web ? t('webAuto') : t('webDisabled'));
  }
  else if(a==='theme'){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();updateThemeLabel();save();}
  else if(a==='open'){S.cur=id;save();shell();closeDrawer();focusInput();}
  else if(a==='collapse'){S.col=!S.col;save();$('#side').classList.toggle('col',S.col)}
  else if(a==='drawer'){innerWidth<=800?$('#side').classList.toggle('open'):(S.col=!S.col,save(),$('#side').classList.toggle('col',S.col))}
  else if(a==='expandsearch'){S.col=false;save();$('#side').classList.remove('col');$('#q').focus()}
  else if(a==='send')send();else if(a==='stop'){if(S.cur && activeRuns.has(S.cur)){activeRuns.get(S.cur).controller.abort();activeRuns.delete(S.cur);updSend();focusInput();}}
  else if(a==='sug')send(b.dataset.t);
  else if(a==='attach')$('#file').click();
  else if(a==='voice')toggleVoice();
  else if(a==='rmfile'){atts.splice(+b.dataset.i,1);drawAtts();updSend()}
  else if(a==='settings')settings();
  else if(a==='openmodelsettings')settings('providers');
  else if(a==='menu'){e.stopPropagation();const v=S.convs.find(x=>x.id===id);popover(b,`<button data-act="rename" data-id="${id}">${t('rename')}</button><button data-act="pinc" data-id="${id}">${v.pinned?t('unpin'):t('pin')}</button><button data-act="exp" data-id="${id}">${t('exportMd')}</button><div class="sep"></div><button style="color:var(--err)" data-act="del" data-id="${id}">${t('del')}</button>`)}
  else if(a==='rename'){const v=S.convs.find(x=>x.id===id),rName=await dialog({title:t('renameTitle'),input:v.title,ok:t('rename')});if(rName?.trim()){v.title=rName.trim();save();shell()}}
  else if(a==='pinc'){const v=S.convs.find(x=>x.id===id);v.pinned=!v.pinned;save();$('#list').innerHTML=sideHTML()}
  else if(a==='exp'){const v=S.convs.find(x=>x.id===id),u=URL.createObjectURL(new Blob([v.msgs.map(m=>`**${m.role}**\n\n${m.text}`).join('\n\n---\n\n')],{type:'text/markdown'})),l=document.createElement('a');l.href=u;l.download=v.title+'.md';l.click();URL.revokeObjectURL(u)}
  else if(a==='del'){const v=S.convs.find(x=>x.id===id);if(await dialog({title:t('delTitle'),body:`"${esc(v.title)}" ${t('delConfirm')}`,ok:t('del'),danger:1})){S.convs=S.convs.filter(x=>x.id!==id);if(S.cur===id)S.cur=null;save();shell()}}
  else if(a==='copymsg'){const m=c.msgs[+b.closest('.msg').dataset.i];navigator.clipboard.writeText(m.text).then(()=>toast(t('copied')),()=>toast(t('copyFailed')))}
  else if(a==='copycode'){navigator.clipboard.writeText($('code',b.closest('.cb')).textContent).then(()=>{const orig=b.innerHTML;b.innerHTML=`${ic('check')} <span>${t('copiedCode')}</span>`;setTimeout(()=>b.innerHTML=orig,1400)},()=>toast(t('copyFailed')))}
  else if(a==='openinbrowser'){
    e.preventDefault();
    const url = b.dataset.url || b.getAttribute('href');
    if(url) InsideBrowser.open(url);
  }
  else if(a==='openpreview'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      InsideBrowser.open('data:text/html;charset=utf-8,' + encodeURIComponent(code));
    }
  }
  else if(a==='saveworkspace'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      const tag = $('.cb-tag', cb)?.textContent?.trim() || 'file';
      const ext = tag.includes(' ') ? tag.split(' ').pop() : tag;
      const cleanExt = ext.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 10);
      const defName = 'modified_' + (cleanExt ? 'script.' + cleanExt : 'document.txt');
      const filename = await dialog({ title: t('saveToWorkspace'), input: defName, ok: t('saveBtn') });
      if(filename && filename.trim()){
        try {
          const res = await fetch('/api/files/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename.trim(), content: code })
          });
          if(res.ok) {
            toast(t('savedToWorkspace') + ` (${filename.trim()})`);
          } else {
            toast('Save failed');
          }
        } catch(err){ toast('Save failed'); }
      }
    }
  }
  else if(a==='downloadcode'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      const tag = $('.cb-tag', cb)?.textContent?.trim() || 'file';
      const ext = tag.includes(' ') ? tag.split(' ').pop() : tag;
      const cleanExt = ext.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 10);
      const filename = 'modified_' + (cleanExt ? 'file.' + cleanExt : 'document.txt');
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.click(); URL.revokeObjectURL(url);
      toast(t('downloadBtn') + ` (${filename})`);
    }
  }
  else if(a==='togglebrowser'){
    InsideBrowser.toggle();
  }
  else if(a==='closeib'){
    InsideBrowser.close();
  }
  else if(a==='maximizeib'){
    InsideBrowser.toggleMaximize();
  }
  else if(a==='reloadib'){
    InsideBrowser.reload();
  }
  else if(a==='ibback'){
    InsideBrowser.back();
  }
  else if(a==='ibfwd'){
    InsideBrowser.forward();
  }
  else if(a==='ibhome'){
    InsideBrowser.home();
  }
  else if(a==='ibgo'){
    InsideBrowser.navigate($('#ibUrlInput')?.value);
  }
  else if(a==='openibnewtab'){
    InsideBrowser.openNewTab();
  }
  else if(a==='fb'){const m=c.msgs[+b.closest('.msg').dataset.i];m.fb=m.fb===b.dataset.v?null:b.dataset.v;save();drawMsgs()}
  else if(a==='retry'&&!run){while(c.msgs.at(-1)?.role==='assistant')c.msgs.pop();drawMsgs();await generate(c)}
});

document.addEventListener('keydown',e=>{
  // If modal or popover is open, ignore
  if($('.ov') || pop) return;

  // Direct typing capture: if user types a printable key while not in another input, automatically focus input
  if(!e.ctrlKey && !e.metaKey && !e.altKey && e.key && e.key.length === 1 && !e.isComposing){
    const active = document.activeElement;
    const isInputActive = active && (
      active.tagName === 'INPUT' ||
      active.tagName === 'TEXTAREA' ||
      active.isContentEditable ||
      Boolean(active.closest && active.closest('.modal'))
    );
    if(!isInputActive){
      const el = (S.view === 'rag') ? $('#ragInp') : $('#inp');
      if(el){
        el.focus();
      }
    }
  }

  if(e.target && e.target.id === 'ibUrlInput' && e.key === 'Enter'){
    e.preventDefault();
    InsideBrowser.navigate(e.target.value);
    return;
  }
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='n'){e.preventDefault();newChat();focusInput();}
  else if(mod&&k==='k'){e.preventDefault();S.col=false;$('#side').classList.remove('col');$('#side').classList.add('open');$('#q').focus()}
  else if(mod&&k==='/'){e.preventDefault();$('#inp').focus()}else if(k==='escape'){closePop();closeDrawer()}
});
matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>S.theme==='system'&&applyTheme());

// Inline citation inspector listener
document.addEventListener('click', e => {
  const citEl = e.target.closest('.inline-cit');
  if(citEl){
    const doc = citEl.dataset.doc;
    const chunkId = parseInt(citEl.dataset.chunk || '0', 10);
    let matchedChunk = null;
    for(let k = S.ragMsgs.length - 1; k >= 0; k--){
      const cList = S.ragMsgs[k].citations || [];
      matchedChunk = cList.find(c => c.doc === doc && c.chunk_id === chunkId);
      if(matchedChunk) break;
    }
    if(matchedChunk){
      inspectChunkModal({
        doc: matchedChunk.doc,
        chunk: matchedChunk.chunk_id,
        score: Math.round((matchedChunk.score||0)*100),
        dense: Math.round((matchedChunk.dense_score||0)*100),
        lex: Math.round((matchedChunk.lexical_score||0)*100),
        text: matchedChunk.text || ''
      });
    } else {
      toast(`${doc} #${chunkId}`);
    }
  }
});

applyTheme();shell();InsideBrowser.init();loadRagDocs();focusInput();
Axom.models().then(m=>{
  models=m;
  if(m.length&&!m.some(x=>x.id===S.model))S.model=m[0].id;
  updateHeaderModel();
  save();
  updSend();
});
</script>
