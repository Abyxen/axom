<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXOM — Independent Intelligence</title>
<meta name="description" content="Think off-script. An independent AI workspace for ideas, code, and everything in between.">
<meta name="theme-color" content="#111110">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root,[data-theme=dark]{
  --bg:#09090b;--bg2:#111114;--surf:#18181b;--elev:#222226;--input:#141416;
  --bd:#27272a;--tx:#f4f4f5;--tx2:#a1a1aa;--tx3:#71717a;--ac:#ff512f;--ach:#ff6b4d;
  --acid:#d5f85a;--ok:#45D483;--err:#F06464;--sh:none;--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#f8f8f6;--bg2:#efeee8;--surf:#ffffff;--elev:#e4e3dc;--input:#ffffff;
  --bd:#d4d3cb;--tx:#181914;--tx2:#55574b;--tx3:#717167;--ac:#cf351a;--ach:#b52d16;
  --acid:#cee955;--ok:#1b9e52;--err:#cf351a;--sh:none;
  color-scheme:light;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
::selection{background:var(--ac);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--tx3)}

.app{display:flex;height:100dvh;position:relative;z-index:1;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1.1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 rgba(255,81,47,0)}50%{box-shadow:0 0 16px rgba(255,81,47,.25)}}

.ib{display:grid;place-items:center;width:30px;height:30px;border-radius:0;color:var(--tx2);transition:all .18s var(--ease)}
.ib:hover{background:var(--elev);color:var(--tx);transform:scale(1.06)}
.ib:active{transform:scale(.94)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:0;border:1px solid var(--bd);background:var(--surf);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;transition:all .18s var(--ease)}
.btn:hover{background:var(--elev);border-color:var(--tx2);transform:translateY(-1px)}.btn:active{transform:translateY(1px)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ach);box-shadow:0 4px 12px rgba(255,81,47,.3)}.btn.dng{color:var(--err)}

/* sidebar */
.side{width:260px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:30px 19px 17px;transition:width .25s var(--ease);flex:none;overflow:hidden;position:relative}
.logo-btn{display:flex;align-items:center;gap:7px;padding:0 0 29px;text-align:left;border:0;background:none;cursor:pointer;transition:transform .2s var(--ease)}
.logo-btn:hover{transform:translateX(3px)}
.logo-btn span{font:46px/.9 Anton,sans-serif;letter-spacing:-1px;color:var(--tx);transition:color .2s}
.logo-btn:hover span{color:var(--ac)}
.logo-btn sup{color:var(--ac);font:18px 'JetBrains Mono',monospace;margin-top:-21px}
.edition{margin-left:auto;text-align:right;font:8px/1.6 'JetBrains Mono',monospace;color:var(--tx3)}
.side .row{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:0;color:var(--tx2);font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;transition:all .18s var(--ease)}
.side .row:hover,.side .row.on{background:var(--elev);color:var(--tx);transform:translateX(3px)}
.side .new-chat{background:var(--ac);color:#fff;justify-content:flex-start;padding:13px 14px;font-weight:600;box-shadow:0 2px 8px rgba(255,81,47,.25);transition:all .2s var(--ease)}
.side .new-chat:hover{background:var(--ach);transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,81,47,.4)}
.side .new-chat:active{transform:translateY(1px)}
.new-chat kbd{margin-left:auto;font:10px 'JetBrains Mono',monospace;opacity:.7}
.search{margin:16px 0 22px;position:relative}
.search input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:9px 0 12px 27px;font-size:11px;outline:0;transition:all .2s var(--ease)}
.search input:focus{border-color:var(--ac);padding-left:32px}.search svg{position:absolute;left:2px;top:10px;color:var(--tx3);transition:color .2s}
.search input:focus+svg,.search:focus-within svg{color:var(--ac)}
.search kbd{position:absolute;right:4px;top:10px;color:var(--tx3);font:10px monospace;pointer-events:none}
.list{flex:1;overflow:auto;padding-bottom:8px}
.grp{font:9px 'JetBrains Mono',monospace;text-transform:uppercase;color:var(--tx3);padding:14px 10px 7px;letter-spacing:1.6px}
.item{position:relative;display:flex;align-items:center;animation:rise .3s var(--ease) backwards;animation-delay:calc(var(--n,0)*30ms)}
.item .row{flex:1;min-width:0;font-size:11px;color:var(--tx2);padding:11px 10px;transition:all .18s var(--ease)}
.item .row:before{content:'↗';color:var(--tx3);font-size:15px;margin-right:4px;transition:color .2s,transform .2s}
.item:hover .row:before{color:var(--ac);transform:translate(2px,-2px)}
.item .row.on{background:var(--elev);color:var(--tx);border-left:2px solid var(--ac)}
.item .t{overflow:hidden;text-overflow:ellipsis}
.item .more{position:absolute;right:4px;opacity:0;width:28px;height:28px;background:var(--elev);transition:all .15s}
.item:hover .more,.item .more:focus-visible{opacity:1}
.sidebar-note{padding:18px 10px 22px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.sidebar-note .tiny{font:9px 'JetBrains Mono',monospace;color:var(--acid);display:flex;gap:6px;align-items:center;text-transform:uppercase;letter-spacing:1px}
.sidebar-note .tiny:before{content:'';width:5px;height:5px;background:var(--acid)}
.sidebar-note p{font-size:11px;color:var(--tx3);line-height:1.7;margin:8px 0 0}
.profile{display:flex;align-items:center;gap:10px;padding:17px 8px 0;margin-top:12px;border-top:1px solid var(--bd)}
.avatar{width:30px;height:30px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font:16px Anton;transition:transform .2s var(--ease)}
.profile:hover .avatar{transform:rotate(-6deg) scale(1.08)}
.profile strong{display:block;font-size:11px;font-weight:500}
.profile small{font:8px 'JetBrains Mono',monospace;color:var(--tx3)}
.profile .bar{width:39px;height:20px;margin-left:auto;opacity:.65;background:repeating-linear-gradient(90deg,var(--tx) 0 2px,transparent 2px 4px,var(--tx) 4px 5px,transparent 5px 8px,var(--tx) 8px 11px,transparent 11px 13px)}
mark{background:var(--acid);color:#000;border-radius:0}

/* sidebar collapsed */
.side.col{width:72px;padding-inline:13px}
.side.col .edition,.side.col .logo-btn,.side.col .sidebar-note,.side.col .profile,.side.col kbd,.side.col .lbl,.side.col .search,.side.col .grp{display:none}
.side.col .new-chat{padding:12px;justify-content:center}
.side.col .row{justify-content:center;padding:12px}
.colonly{display:none}.side.col .colonly{display:flex}

/* main section */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hdr{height:74px;min-height:74px;padding:0 33px;border-bottom:1px solid var(--bd);gap:14px;background:var(--bg);display:flex;align-items:center;transition:background .2s}
.hdr .ttl{flex:0 1 auto;text-align:left;font:10px 'JetBrains Mono',monospace;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.hdr .ttl b{color:var(--tx);font-weight:400}
.hdr .sp{flex:1}

/* language switch in header */
.lang-switch{display:inline-flex;align-items:center;border:1px solid var(--bd);background:var(--surf);padding:2px;gap:2px}
.lang-btn{padding:5px 10px;font:10px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--tx2);transition:all .18s var(--ease);border:0;background:none;cursor:pointer}
.lang-btn:hover{color:var(--tx);background:var(--elev)}
.lang-btn.on{background:var(--ac);color:#fff;font-weight:600;box-shadow:0 1px 4px rgba(255,81,47,.25)}

/* chat container */
.chat{flex:1;overflow:auto;scrollbar-gutter:stable;scroll-behavior:smooth}
.col-in{max-width:880px;padding:0 36px;margin:auto}
.session-label{font:500 10px/1 'JetBrains Mono',monospace;color:var(--tx3);border-bottom:1px solid var(--bd);padding:22px 0 16px;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px;animation:rise .3s var(--ease)}
.msg{padding:12px 0 20px;animation:rise .3s var(--ease)}
.msg.in{animation:rise .35s var(--ease)}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .who{display:none}
.msg.user .bd{background:#27272a;border:1px solid #3f3f46;border-radius:14px;border-bottom-right-radius:4px;font-size:14px;line-height:1.55;padding:10px 16px;white-space:pre-wrap;color:#f4f4f5;max-width:82%;box-shadow:0 2px 8px rgba(0,0,0,.15);letter-spacing:-.01em}
.msg:not(.user) .who{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.6px;color:#71717a;text-transform:uppercase;margin-bottom:10px}
.msg:not(.user) .bd{padding:0;font-size:14.5px;line-height:1.7;color:#e4e4e7;overflow-wrap:anywhere}
.bd p{margin:0 0 14px}.bd p:last-child{margin-bottom:0}
.bd h1,.bd h2,.bd h3,.bd h4{color:#ffffff;font-weight:600;letter-spacing:-.015em;margin:22px 0 10px}
.bd h1{font-size:20px}.bd h2{font-size:17px}.bd h3{font-size:15px}
.bd ul,.bd ol{margin:10px 0 16px;padding-left:22px}
.bd li{margin-bottom:6px;line-height:1.65}
.bd strong{font-weight:600;color:#ffffff}
.bd.live>:last-child::after{content:'';display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:text-bottom;background:var(--ac);animation:blink .9s steps(1) infinite}
.bd code{font:12.5px/1.4 'JetBrains Mono',Consolas,Monaco,monospace;background:#202024;color:#f4f4f5;padding:2.5px 6px;border-radius:5px;border:1px solid #2e2e34}
.bd blockquote{margin:12px 0;padding-left:14px;border-left:3px solid var(--ac);color:var(--tx2);font-style:italic}
.bd a{color:var(--ac);text-decoration:underline;text-underline-offset:3px;transition:opacity .15s}
.bd a:hover{opacity:.85}

/* modern code blocks */
.cb{margin:16px 0 20px;background:#18181b;border:1px solid #27272a;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cb header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#1f1f23;border-bottom:1px solid #27272a;font:500 11px/1 'JetBrains Mono',monospace;color:#a1a1aa}
.cb-tag{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;text-transform:lowercase;letter-spacing:.3px;color:#a1a1aa}
.cb-tag svg{width:13px;height:13px;color:#71717a}
.cb-actions{display:flex;align-items:center;gap:6px}
.cb header .btn-copy{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:transparent;border:1px solid transparent;border-radius:5px;font:500 11px 'JetBrains Mono',monospace;color:#a1a1aa;transition:all .15s;cursor:pointer}
.cb header .btn-copy:hover{background:#27272a;color:#ffffff;border-color:#3f3f46}
.cb header .btn-copy svg{width:12px;height:12px}
.cb pre{margin:0;padding:14px 16px;overflow-x:auto;font:13px/1.6 'JetBrains Mono',Consolas,Monaco,monospace;color:#f4f4f5}
.cb pre code{background:none;border:0;padding:0;color:inherit;font:inherit}

/* markdown tables */
.table-wrap{width:100%;overflow-x:auto;margin:18px 0 22px}
.bd table{width:100%;border-collapse:collapse;font-size:13.5px}
.bd th{text-align:left;padding:10px 18px 10px 0;font-weight:600;color:#ffffff;border-bottom:1px solid #27272a;font-size:13px;letter-spacing:-.01em}
.bd td{padding:12px 18px 12px 0;color:#d4d4d8;border-bottom:1px solid #1f1f23;line-height:1.55}
.bd tr:last-child td{border-bottom:none}

.acts{display:flex;gap:4px;margin-top:14px;opacity:0.6;transition:opacity .2s}
.msg:hover .acts{opacity:1}
.acts .ib{width:28px;height:28px;border-radius:6px;color:#71717a;transition:all .15s}
.acts .ib:hover{background:#27272a;color:#f4f4f5}
.acts .ib.on{color:var(--ac);background:rgba(255,81,47,.1)}

/* welcome / street style empty home screen */
.home-view .main{justify-content:center;align-items:center}
.home-view .hdr{position:absolute;top:0;left:0;right:0;border-bottom:1px solid var(--bd)}
.home-view .chat{flex:0 0 auto;overflow:visible;width:100%;max-width:860px;margin-top:auto}
.home-view .col-in{width:100%;max-width:860px;padding:0 24px;margin:0 auto}
.empty{width:100%;text-align:center;position:relative;margin:0 auto 20px;animation:rise .5s var(--ease)}
.home-hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:0}
.home-brand{display:inline-flex;align-items:center;gap:8px;transition:transform .2s var(--ease)}
.home-brand:hover{transform:scale(1.04)}
.home-brand .brand-logo{font:36px/.9 Anton,sans-serif;letter-spacing:-1px;color:var(--tx)}
.home-brand .brand-logo sup{color:var(--ac);font:16px 'JetBrains Mono',monospace;margin-top:-16px}
.home-hero h1{font:clamp(52px,6.8vw,88px)/0.95 Anton,sans-serif;letter-spacing:-1.5px;text-transform:uppercase;margin:0;color:var(--tx);text-shadow:0 4px 18px rgba(0,0,0,.4)}
.home-hero h1 .outline{color:transparent;-webkit-text-stroke:1.2px var(--tx);transition:-webkit-text-stroke-color .2s}
.home-hero:hover h1 .outline{-webkit-text-stroke-color:var(--ac)}

/* composer / input */
.comp{padding:20px 62px 24px;position:relative;transition:all .35s var(--ease)}
.home-view .comp{padding:0 24px;width:100%;max-width:860px;margin:0 auto auto;animation:rise .5s var(--ease) .1s backwards}
.cbox{max-width:936px;margin:0 auto;padding:18px 19px 12px;background:var(--input);border:1px solid var(--tx3);box-shadow:none;position:relative;transition:all .25s var(--ease)}
.cbox:hover{border-color:var(--tx2)}
.cbox:focus-within,.cbox.drag{border-color:var(--ac);box-shadow:0 0 20px rgba(255,81,47,.22);transform:translateY(-1px)}
.cbox:before{content:'';width:6px;height:6px;background:var(--ac);position:absolute;left:-3px;top:-3px;transition:transform .2s}
.cbox:focus-within:before{transform:scale(1.5)}
.cbox textarea{width:100%;border:0;background:none;outline:0;resize:none;max-height:200px;min-height:34px;font:13px/1.6 Inter,sans-serif;font-size:14px}
.cbox textarea::placeholder{font:13px Inter,sans-serif;color:var(--tx3);transition:color .2s}
.cbox:focus-within textarea::placeholder{color:var(--tx2)}
.tools{display:flex;align-items:center;gap:8px;margin-top:6px}.tools .sp{flex:1}
.attach-label{font:9px 'JetBrains Mono',monospace;color:var(--tx3);letter-spacing:1px}
.mic-btn{display:grid;place-items:center;width:32px;height:32px;border-radius:0;color:var(--tx2);transition:all .18s var(--ease)}
.mic-btn:hover{background:var(--elev);color:var(--tx);transform:scale(1.06)}
.mic-btn:active{transform:scale(.94)}
.mic-btn.recording{color:#ff473d;background:rgba(255,71,61,.18);border:1px solid #ff473d;animation:micPulse 1.2s infinite ease-in-out}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 rgba(255,71,61,0);transform:scale(1)}50%{box-shadow:0 0 14px rgba(255,71,61,.5);transform:scale(1.08)}}
.send{width:38px;height:34px;border-radius:0;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;transition:all .18s var(--ease)}
.send:hover{background:var(--ach);transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,81,47,.4)}.send:active{transform:translateY(1px)}.send:disabled{background:var(--elev);color:var(--tx3);cursor:not-allowed;transform:none;box-shadow:none}
.hint{max-width:936px;margin:12px auto 0;display:flex;justify-content:space-between;font:8px 'JetBrains Mono',monospace;letter-spacing:.25px;color:var(--tx3)}
.hint kbd{font:inherit;color:var(--tx2)}

/* web toggle & tool cards */
.web-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--bd);border-radius:15px;color:var(--tx2);background:var(--surf);font:500 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;letter-spacing:-.01em;transition:all .18s var(--ease);cursor:pointer;user-select:none;white-space:nowrap}
.web-btn svg{width:14px;height:14px;color:var(--tx3);transition:color .18s,transform .18s;flex-shrink:0}
.web-btn:hover{background:var(--elev);color:var(--tx);border-color:#3f3f46}
.web-btn:hover svg{color:var(--tx)}
.web-btn.on{background:rgba(255,81,47,.12);color:var(--ac);border-color:var(--ac);box-shadow:0 0 10px rgba(255,81,47,.15)}
.web-btn.on svg{color:var(--ac)}
.web-btn:active{transform:scale(.96)}
/* thinking & agentic tool trace (compact accordions) */
details.think, details.tool-trace {
  margin: 10px 0 14px;
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
  transition: all .2s var(--ease);
  width: fit-content;
  max-width: 100%;
}
details.think[open], details.tool-trace[open] {
  width: 100%;
  background: var(--surf);
  border-color: var(--tx3);
}
details.think summary, details.tool-trace summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 500;
  color: var(--tx2);
  cursor: pointer;
  user-select: none;
  list-style: none;
  transition: all .15s ease;
}
details.think summary::-webkit-details-marker,
details.tool-trace summary::-webkit-details-marker {
  display: none;
}
details.think summary:hover,
details.tool-trace summary:hover {
  color: var(--tx);
  background: var(--elev);
}
.think-icon {
  display: inline-flex;
  align-items: center;
  color: var(--tx2);
  flex-shrink: 0;
}
.think-icon svg {
  width: 14px;
  height: 14px;
}
.think-icon.running svg {
  color: var(--ac);
  animation: micPulse 1.2s infinite ease-in-out;
}
.think-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  letter-spacing: -0.01em;
}
.think-chevron {
  display: inline-flex;
  align-items: center;
  color: var(--tx3);
  transition: transform .2s var(--ease);
  flex-shrink: 0;
}
.think-chevron svg {
  width: 13px;
  height: 13px;
}
details[open] .think-chevron svg {
  transform: rotate(180deg);
  color: var(--tx);
}

/* inside expanded body */
.think-body {
  padding: 11px 13px;
  border-top: 1px solid var(--bd);
  background: var(--bg2);
  font-size: 12px;
  line-height: 1.6;
}
details.think .think-body {
  color: var(--tx2);
  white-space: pre-wrap;
  font-family: 'JetBrains Mono', Consolas, monospace;
  font-size: 11.5px;
  max-height: 260px;
  overflow-y: auto;
}
.trace-section {
  margin-bottom: 11px;
}
.trace-section:last-child {
  margin-bottom: 0;
}
.trace-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--tx3);
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.trace-section-title svg {
  width: 11px;
  height: 11px;
}
.trace-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.trace-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  color: var(--tx);
  font-size: 12px;
  line-height: 1.45;
}
.trace-item svg {
  width: 13px;
  height: 13px;
  color: var(--tx3);
  margin-top: 2px;
  flex-shrink: 0;
}
.trace-query {

/* ---- markdown parser with full table support & clean code blocks ---- */
function inline(t){t=esc(t);return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function md(src){
  const h=[];
  src.split(/```/).forEach((p,i)=>{
    if(i%2){
      const nl=p.indexOf('\n'),lang=(nl<0?p:p.slice(0,nl)).trim(),code=nl<0?'':p.slice(nl+1);
      const isHtml = ['html','htm'].includes(lang.toLowerCase()) || /<!DOCTYPE html|<html[\s>]/i.test(code);
      const previewBtn = isHtml ? `<button class="btn-preview" data-act="openpreview" title="${t('previewInBrowser')}">${ic('globe')} <span>${t('previewBtn')}</span></button>` : '';
      const saveBtn = `<button class="btn-copy" data-act="saveworkspace" title="${t('saveToWorkspace')}">${ic('save')} <span>${t('saveBtn')}</span></button>`;
      const dlBtn = `<button class="btn-copy" data-act="downloadcode" title="${t('downloadFile')}">${ic('download')} <span>${t('downloadBtn')}</span></button>`;
      h.push(`<div class="cb"><header><span class="cb-tag">${ic('code')} ${esc(lang||'text')}</span><div class="cb-actions">${previewBtn}${saveBtn}${dlBtn}<button class="btn-copy" data-act="copycode">${ic('copy')} <span>${t('copy')}</span></button></div></header><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`);
      return;
    }
    const lines = p.split('\n');
    let lineIdx = 0;
    let list = null;
    const closeList = () => { if(list) { h.push(`</${list}>`); list = null; } };

    while (lineIdx < lines.length) {
      const l = lines[lineIdx];

      // Markdown Table: line has '|' and next line is standard divider '| --- | --- |'
      if (l.includes('|') && lineIdx + 1 < lines.length && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(lines[lineIdx + 1].trim())) {
        closeList();
        const parseRow = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const headers = parseRow(l);
        lineIdx += 2;
        const tableRows = [];
        while (lineIdx < lines.length && lines[lineIdx].includes('|') && lines[lineIdx].trim() !== '') {
          tableRows.push(parseRow(lines[lineIdx]));
          lineIdx++;
        }
        let tbl = '<div class="table-wrap"><table><thead><tr>' + headers.map(th => `<th>${inline(th)}</th>`).join('') + '</tr></thead><tbody>';
        for (const row of tableRows) {
          if (row.length === 1 && !row[0]) continue;
          tbl += '<tr>' + row.map(td => `<td>${inline(td)}</td>`).join('') + '</tr>';
        }
        tbl += '</tbody></table></div>';
        h.push(tbl);
        continue;
      }

      let m;
      if (m = l.match(/^[-*]\s+(.*)/)) {
        if (list !== 'ul') { closeList(); h.push('<ul>'); list = 'ul'; }
        h.push(`<li>${inline(m[1])}</li>`);
      } else if (m = l.match(/^\d+\.\s+(.*)/)) {
        if (list !== 'ol') { closeList(); h.push('<ol>'); list = 'ol'; }
        h.push(`<li>${inline(m[1])}</li>`);
      } else {
        closeList();
        if (m = l.match(/^(#{1,4})\s+(.*)/)) {
          h.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`);
        } else if (m = l.match(/^>\s?(.*)/)) {
          h.push(`<blockquote>${inline(m[1])}</blockquote>`);
        } else if (l.trim()) {
          h.push(`<p>${inline(l)}</p>`);
        }
      }
      lineIdx++;
    }
    closeList();
  });
  return h.join('');
}

const hl=(t,q)=>{t=esc(t);if(!q)return t;return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')};

const InsideBrowser = {
  isOpen: false,
  isMaximized: false,
  currentUrl: 'https://www.google.com',
  currentTitle: 'Google',

  init(){
    window.addEventListener('message', ev => {
      if(ev.data && (ev.data.act === 'browserNavigated' || ev.data.act === 'browserLoaded')){
        if(ev.data.url){
          InsideBrowser.currentUrl = ev.data.url;
          const input = $('#ibUrlInput');
          if(input && document.activeElement !== input) input.value = ev.data.url;
          try {
            const host = new URL(ev.data.url).hostname;
            InsideBrowser.currentTitle = ev.data.title || host;
            const tabTitle = $('#ibTabTitle');
            if(tabTitle) tabTitle.textContent = InsideBrowser.currentTitle;
          } catch(e){}
        }
      }
    });
  },

  navigate(rawInput){
    if(!rawInput) return;
    let input = rawInput.trim();
    let url = '';
    if(input.startsWith('data:') || input.startsWith('blob:')){
      url = input;
    } else if(/^https?:\/\//i.test(input)){
      url = input;
    } else if(/^[\w-]+\.[a-z]{2,}(\/.*)?$/i.test(input) || input.includes('localhost:') || input.includes('127.0.0.1:')){
      url = 'https://' + input;
    } else {
      url = 'https://www.google.com/search?q=' + encodeURIComponent(input);
    }
    this.currentUrl = url;
    try {
      this.currentTitle = url.startsWith('data:') ? 'Custom Page' : new URL(url).hostname;
    } catch(e){
      this.currentTitle = 'Web';
    }
    const inputEl = $('#ibUrlInput');
    if(inputEl) inputEl.value = url;
    const tabTitle = $('#ibTabTitle');
    if(tabTitle) tabTitle.textContent = this.currentTitle;
    const frame = $('#ibFrame');
    if(frame){
      if(url.startsWith('data:')){
        frame.src = url;
      } else {
        frame.src = '/api/browser/proxy?url=' + encodeURIComponent(url);
      }
    }
  },

  open(url){
    this.isOpen = true;
    const app = $('#app');
    if(app) app.classList.add('browser-open');
    this.navigate(url || this.currentUrl || 'https://www.google.com');
  },

  close(){
    this.isOpen = false;
    this.isMaximized = false;
    const app = $('#app');
    if(app) app.classList.remove('browser-open');
    const panel = $('#insideBrowser');
    if(panel) panel.classList.remove('maximized');
  },

  toggle(){
    if(this.isOpen) this.close();
    else this.open(this.currentUrl || 'https://www.google.com');
  },

  toggleMaximize(){
    this.isMaximized = !this.isMaximized;
    const panel = $('#insideBrowser');
    if(panel) panel.classList.toggle('maximized', this.isMaximized);
    const maxBtn = $('#ibMaxBtn');
    if(maxBtn) maxBtn.innerHTML = ic(this.isMaximized ? 'shrink' : 'expand');
  },

  back(){
    try { $('#ibFrame')?.contentWindow?.history.back(); } catch(e){}
  },

  forward(){
    try { $('#ibFrame')?.contentWindow?.history.forward(); } catch(e){}
  },

  reload(){
    const frame = $('#ibFrame');
    if(!frame) return;
    if(this.currentUrl.startsWith('data:')){
      frame.src = this.currentUrl;
    } else {
      frame.src = '/api/browser/proxy?url=' + encodeURIComponent(this.currentUrl);
    }
  },

  home(){
    this.navigate('https://www.google.com');
  },

  openNewTab(){
    window.open(this.currentUrl || 'https://www.google.com', '_blank');
  },

  render(){
    const tabTitle = $('#ibTabTitle');
    if(tabTitle) tabTitle.textContent = this.currentTitle || 'Google';
    const urlInput = $('#ibUrlInput');
    if(urlInput) urlInput.value = this.currentUrl || 'https://www.google.com';
    const frame = $('#ibFrame');
    if(frame && !frame.src){
      frame.src = '/api/browser/proxy?url=' + encodeURIComponent(this.currentUrl || 'https://www.google.com');
    }
  }
};

function toolsTraceHTML(tools, isOpen=false){
  if(!tools||!tools.length) return '';
  const isRunning = tools.some(x=>x.status==='running');
  const runningTool = tools.find(x=>x.status==='running');

  const sourcesMap = new Map();
  const searches = [];

  for(const tObj of tools){
    if(tObj.name==='search_web'){
      const q = tObj.args?.query || '';
      searches.push({ type: 'search', text: q, isRunning: tObj.status==='running' });
      const results = tObj.result?.results || [];
      for(const r of results){
        if(r && r.url && !sourcesMap.has(r.url)){
          sourcesMap.set(r.url, r);
        }
      }
    }else if(tObj.name==='academic_search'){
      const q = tObj.args?.query || '';
      searches.push({ type: 'academic', text: q, isRunning: tObj.status==='running' });
      const papers = tObj.result?.papers || [];
      for(const p of papers){
        const link = p.pdf_url || p.url;
        if(link && !sourcesMap.has(link)){
          sourcesMap.set(link, { title: `${p.citation_key ? '['+p.citation_key+'] ' : ''}${p.title} (${p.year})`, url: link });
        }
      }
    }else if(tObj.name==='evaluate_research_gap'){
      searches.push({ type: 'gap', text: tObj.args?.topic || '3-Gate Gap Dossier', isRunning: tObj.status==='running' });
    }else if(tObj.name==='create_design_brief'){
      searches.push({ type: 'design', text: tObj.args?.research_question || 'Socratic Design Brief', isRunning: tObj.status==='running' });
    }else if(tObj.name==='build_literature_matrix'){
      searches.push({ type: 'matrix', text: 'Literature Triage Matrix', isRunning: tObj.status==='running' });
    }else if(tObj.name==='conduct_paper_review'){
      searches.push({ type: 'review', text: 'Scientific Peer Review', isRunning: tObj.status==='running' });
    }else if(tObj.name==='generate_bibtex'){
      searches.push({ type: 'bibtex', text: tObj.args?.title || 'BibTeX Citation', isRunning: tObj.status==='running' });
    }else if(tObj.name==='browse_page'){
      searches.push({ type: 'browse', text: tObj.args?.url || '', isRunning: tObj.status==='running' });
    }else if(tObj.name==='open_browser'){
      searches.push({ type: 'browser', text: tObj.args?.url || '', isRunning: tObj.status==='running' });
    }else{
      searches.push({ type: 'tool', text: tObj.name, isRunning: tObj.status==='running' });
    }
  }

  const uniqueSources = Array.from(sourcesMap.values());

  let summaryTitle = '';
  if(isRunning && runningTool){
    if(runningTool.name==='search_web'){
      summaryTitle = runningTool.args?.query ? `${t('toolSearching')} "${runningTool.args.query}"` : t('toolSearching');
    }else if(runningTool.name==='academic_search'){
      summaryTitle = runningTool.args?.query ? `${t('toolAcademicSearching')} "${runningTool.args.query}"` : t('toolAcademicSearching');
    }else if(runningTool.name==='evaluate_research_gap'){
      summaryTitle = t('toolEvaluatingGap');
    }else if(runningTool.name==='create_design_brief'){
      summaryTitle = t('toolCreatingDesignBrief');
    }else if(runningTool.name==='build_literature_matrix'){
      summaryTitle = t('toolBuildingMatrix');
    }else if(runningTool.name==='conduct_paper_review'){
      summaryTitle = t('toolConductingReview');
    }else if(runningTool.name==='browse_page'){
      summaryTitle = t('toolReadingPage');
    }else if(runningTool.name==='open_browser'){
      summaryTitle = t('toolOpeningBrowser');
    }else{
      summaryTitle = t('thinking');
    }
  }else{
    if(uniqueSources.length === 1){
      summaryTitle = t('searchedSourceSingle');
    }else if(uniqueSources.length > 1){
      summaryTitle = t('searchedSources').replace('{n}', uniqueSources.length);
    }else{
      summaryTitle = t('searchedWeb');
    }
  }

  let searchesHTML = '';
  if(searches.length){
    searchesHTML = `<div class="trace-section"><div class="trace-section-title">${ic('search')} ${t('traceSearches')}</div><div class="trace-list">` +
      searches.map(s=>{
        if(s.type==='search'){
          return `<div class="trace-item">${ic('search')}<span>${t('searchQueryLabel')} <span class="trace-query">"${esc(s.text)}"</span></span></div>`;
        }else if(s.type==='academic'){
          return `<div class="trace-item">${ic('book')}<span>${t('academicSearchLabel')} <span class="trace-query">"${esc(s.text)}"</span></span></div>`;
        }else if(s.type==='gap' || s.type==='design' || s.type==='matrix' || s.type==='review'){
          return `<div class="trace-item">${ic('clipboard')}<span>${esc(s.text)}</span></div>`;
        }else if(s.type==='browse'){
          return `<div class="trace-item">${ic('file')}<span>${t('readPageLabel')} <span class="trace-query">${esc(s.text)}</span></span></div>`;
        }else if(s.type==='browser'){
          return `<div class="trace-item">${ic('globe')}<span>${t('openedBrowserLabel')} <span class="trace-query">${esc(s.text)}</span></span></div>`;
        }else{
          return `<div class="trace-item">${ic('code')}<span>${esc(s.text)}</span></div>`;
        }
      }).join('') +
      `</div></div>`;
  }

  let sourcesHTML = '';
  if(uniqueSources.length){
    sourcesHTML = `<div class="trace-section"><div class="trace-section-title">${ic('clip')} ${t('traceSources')}</div><div class="trace-sources">` +
      uniqueSources.map(r=>{
        return `<a href="${esc(r.url)}" class="trace-source-chip" data-act="openinbrowser" data-url="${esc(r.url)}" title="${esc(r.title||r.url)}">${ic('ext')}<span class="trace-source-title">${esc(r.title||r.url)}</span></a>`;
      }).join('') +
      `</div></div>`;
  }

  const iconHtml = isRunning
    ? `<svg class="spin-circle" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.25" fill="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>`
    : ic('globe');

  return `<details class="tool-trace think-trace"${isOpen?' open':''}>
    <summary class="think-summary">
      <span class="think-icon ${isRunning?'running':''}">${iconHtml}</span>
      <span class="think-title">${esc(summaryTitle)}</span>
      <span class="think-chevron">${ic('chevron')}</span>
    </summary>
    <div class="think-body">
      ${searchesHTML}
      ${sourcesHTML}
    </div>
  </details>`;
}

/* ---- file & folder recursive scanner ---- */
async function scanFiles(items) {
  const fileList = [];
  async function traverse(item) {
    if (item.isFile) {
      await new Promise(res => item.file(f => { fileList.push(f); res(); }));
    } else if (item.isDirectory) {
      const reader = item.createReader();
      const entries = await new Promise(res => reader.readEntries(res));
      for (const entry of entries) {
        if (!entry.name.startsWith('.') && entry.name !== 'node_modules') {
          await traverse(entry);
        }
      }
    }
  }
  for (const item of items) {
    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
    if (entry) await traverse(entry);
    else if (item.getAsFile) { const f = item.getAsFile(); if (f) fileList.push(f); }
  }
  return fileList;
}

async function addFiles(list){
  for(const f of list){
    if(atts.length>=10){toast(t('maxFiles'));break}
    if(f.size>25e6){toast(f.name+' '+t('fileExceeds'));continue}
    const dotIdx = f.name.lastIndexOf('.');
    const ext = dotIdx !== -1 ? f.name.slice(dotIdx).toLowerCase() : '';
    const isImg = f.type.startsWith('image/') || ['.png','.jpg','.jpeg','.webp','.gif','.bmp','.svg'].includes(ext);
    const isPdf = f.type === 'application/pdf' || ext === '.pdf';

    if(isImg){
      const dataUrl = await new Promise(res => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(f);
      });
      atts.push({ name: f.name, type: 'image', data: dataUrl, ext, isImg: true });
    } else if(isPdf){
      const dataUrl = await new Promise(res => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.readAsDataURL(f);
      });
      atts.push({ name: f.name, type: 'pdf', data: dataUrl, ext, isPdf: true });
    } else {
      let tText = '';
      try { tText = await f.text(); } catch(e){}
      if(tText && !tText.includes('\0')){
        if(tText.length>MAXF){tText=tText.slice(0,MAXF);toast(f.name+' '+t('fileTrimmed'))}
        atts.push({ name: f.name, type: 'text', text: tText, ext });
      } else {
        const dataUrl = await new Promise(res => {
          const reader = new FileReader();
          reader.onload = () => res(reader.result);
          reader.readAsDataURL(f);
        });
        atts.push({ name: f.name, type: 'binary', data: dataUrl, ext });
      }
    }
  }
  drawAtts();updSend();
}

function drawAtts(){
  const e=$('#atts');if(!e)return;

function bindInput(){
  const i=$('#inp'),box=$('#cbox'),fi=$('#file');
  i.addEventListener('input',()=>{i.style.height='auto';i.style.height=Math.min(i.scrollHeight,200)+'px';updSend()});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&(S.enterSends?!e.shiftKey:e.ctrlKey)){e.preventDefault();if(!run)send()}});
  i.addEventListener('paste',e=>{if(e.clipboardData.files.length){e.preventDefault();addFiles(e.clipboardData.files)}});
  fi.addEventListener('change',()=>{addFiles(fi.files);fi.value=''});
  box.addEventListener('dragover',e=>{e.preventDefault();box.classList.add('drag')});
  box.addEventListener('dragleave',()=>box.classList.remove('drag'));
  box.addEventListener('drop',async e=>{
    e.preventDefault();
    box.classList.remove('drag');
    if (e.dataTransfer.items) {
      const scanned = await scanFiles(e.dataTransfer.items);
      if (scanned.length) addFiles(scanned);
      else addFiles(e.dataTransfer.files);
    } else {
      addFiles(e.dataTransfer.files);
    }
  });
  let tTimeout;$('#q').addEventListener('input',e=>{clearTimeout(tTimeout);tTimeout=setTimeout(()=>{query=e.target.value;$('#list').innerHTML=sideHTML()},120)});
}

/* ---- chat flow ---- */
function newChat(){S.cur=null;save();atts=[];shell();$('#inp').focus();closeDrawer()}
async function send(text){
  const i=$('#inp');text=(text??i.value);if((!text.trim()&&!atts.length)||run)return;
  let c=cur();if(!c){c={id:'c'+Date.now(),title:text.slice(0,40)||atts[0]?.name||t('newConvHeader'),ts:Date.now(),msgs:[]};S.convs.push(c);S.cur=c.id}

  const currentAtts = [...atts];
  atts=[];i.value='';i.style.height='auto';drawAtts();updSend();

  let parsedCtx = [];
  const filesToParse = currentAtts.filter(f => f.data);
  if(filesToParse.length > 0){
    toast(t('fileParsing'));
    try {
      const pRes = await fetch('/api/files/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          files: filesToParse.map(f => ({ name: f.name, data: f.data, type: f.type })),
          prompt: text
        })
      });
      if(pRes.ok){
        const pData = await pRes.json();
        if(pData.results) parsedCtx = pData.results;
      }
    } catch(err){
      console.warn('File parse error:', err);
    }
  }

  const ctxParts = [];
  for(const f of currentAtts){
    if(f.text){
      ctxParts.push(`[File: ${f.name}]\n${f.text}`);
    } else {
      const match = parsedCtx.find(p => p.name === f.name);
      if(match && match.content){
        ctxParts.push(match.content);
      } else {
        ctxParts.push(`[Attached file: ${f.name}]`);
      }
    }
  }

  c.msgs.push({role:'user',text,files:currentAtts.map(f=>f.name),ctx:ctxParts.join('\n\n')});
  c.ts=Date.now();
  fresh=c.msgs.length-1;shell();fresh=-1;await generate(c);
}

async function generate(c){
  const m={role:'assistant',text:'',think:'',thinkMs:0,tools:[]};c.msgs.push(m);run=new AbortController();const t0=Date.now();
  fresh=c.msgs.length-1;drawMsgs();fresh=-1;updSend();

  const msgEl=$('.msg:last-child',$('#msgs'));
  const el=$('.bd',msgEl);el.classList.add('live');

  let raf=0;
  const paint=()=>{
    raf=0;
    if(S.showThinking && m.think){
      let thinkEl=$('.think',msgEl);
      if(!thinkEl){
        thinkEl=document.createElement('details');
        thinkEl.className='think think-trace';
        msgEl.insertBefore(thinkEl,el);
      }
      const wasOpen = thinkEl.hasAttribute('open');
      thinkEl.innerHTML=`<summary class="think-summary"><span class="think-icon">${ic('code')}</span><span class="think-title">${t('thinking')} · ${(m.thinkMs/1e3).toFixed(1)}s</span><span class="think-chevron">${ic('chevron')}</span></summary><div class="think-body">${esc(m.think)}</div>`;
      if(wasOpen) thinkEl.setAttribute('open','');
    }
    if(m.tools&&m.tools.length){
      let tContainer=$('.tools-wrap',msgEl);
      if(!tContainer){
        tContainer=document.createElement('div');
        tContainer.className='tools-wrap';
        msgEl.insertBefore(tContainer,el);
      }
      const existingDetails = tContainer.querySelector('details');
      const wasOpen = existingDetails ? existingDetails.hasAttribute('open') : false;
      tContainer.innerHTML=toolsTraceHTML(m.tools, wasOpen);
    }
    let loadEl = $('.compute-loading', msgEl);
    if (!m.text) {
      if (!loadEl) {
        loadEl = document.createElement('div');
        loadEl.className = 'compute-loading';
        loadEl.innerHTML = `<svg class="spin-circle" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.25" fill="none"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg><span>${t('thinking')}...</span>`;
        msgEl.insertBefore(loadEl, el);
      }
    } else {
      if (loadEl) loadEl.remove();
    }
    el.innerHTML=md(m.text);
    scrollEnd();
  };

  try{
    for await(const ev of Axom.stream({messages:c.msgs.slice(0,-1),signal:run.signal})){
      if(ev.type==='tool_start'){
        m.tools.push({id:ev.id,name:ev.name,args:ev.args,status:'running'});
        if(!raf)raf=requestAnimationFrame(paint);
      }else if(ev.type==='tool_end'){
        const tObj=m.tools.find(x=>x.id===ev.id)||m.tools.find(x=>x.status==='running')||m.tools.at(-1);
        if(tObj){tObj.status='done';tObj.result=ev.result;}
        if(!raf)raf=requestAnimationFrame(paint);
      }else if(ev.type==='think'){
        m.think+=(ev.text||'');m.thinkMs=Date.now()-t0;
      }else{
        const chunk=ev.text||ev.token||'';
        if(chunk){m.text+=chunk;if(!raf)raf=requestAnimationFrame(paint);}
      }
    }
  }catch(e){
    if(e.name==='AbortError'){m.text+=m.text?'\n\n'+t('genStopped'):t('genStopped')}
    else m.err=e.message||t('genStoppedUnexpected');
  }
  
  if(raf)cancelAnimationFrame(raf);
  run=null;save();drawMsgs();updSend();
}

/* ---- voice dictation (speech-to-text) ---- */
let recognition = null, isRecording = false;

function toggleVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast(t('voiceNotSupported'));
    return;
  }
  const micBtn = $('#micBtn'), inp = $('#inp');
  if (isRecording) {
    if (recognition) {
      try { recognition.stop(); } catch(e){}
    }
    isRecording = false;
    micBtn?.classList.remove('recording');
    toast(t('voiceStopped'));
    return;
  }

  try {
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = S.lang === 'pt' ? 'pt-PT' : 'en-US';

    let baseText = inp.value ? inp.value.trim() + ' ' : '';

    recognition.onstart = () => {
      isRecording = true;
      micBtn?.classList.add('recording');
      toast(t('voiceListening'));
    };

    recognition.onresult = (e) => {
      let interim = '';
      for (let idx = e.resultIndex; idx < e.results.length; idx++) {
        const transcript = e.results[idx][0].transcript;
        if (e.results[idx].isFinal) {
          baseText += transcript + ' ';
        } else {
          interim += transcript;
        }
      }
      inp.value = baseText + interim;
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 200) + 'px';
      updSend();
    };

    recognition.onerror = (e) => {
      console.warn('Voice error:', e.error);
      isRecording = false;
      micBtn?.classList.remove('recording');
      if (e.error !== 'no-speech') {
        toast(t('micError') + e.error);
      }
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn?.classList.remove('recording');
      updSend();
    };

    recognition.start();
  } catch (err) {
    console.error('Failed to start speech recognition:', err);
    isRecording = false;
    micBtn?.classList.remove('recording');
    toast(t('micAccessError'));
  }
}

    }
  }
  else if(a==='downloadcode'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      const tag = $('.cb-tag', cb)?.textContent?.trim() || 'file';
      const ext = tag.includes(' ') ? tag.split(' ').pop() : tag;
      const cleanExt = ext.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 10);
      const filename = 'modified_' + (cleanExt ? 'file.' + cleanExt : 'document.txt');
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.click(); URL.revokeObjectURL(url);
      toast(t('downloadBtn') + ` (${filename})`);
    }
  }
  else if(a==='togglebrowser'){
    InsideBrowser.toggle();
  }
  else if(a==='closeib'){
    InsideBrowser.close();
  }
  else if(a==='maximizeib'){
    InsideBrowser.toggleMaximize();
  }
  else if(a==='reloadib'){
    InsideBrowser.reload();
  }
  else if(a==='ibback'){
    InsideBrowser.back();
  }
  else if(a==='ibfwd'){
    InsideBrowser.forward();
  }
  else if(a==='ibhome'){
    InsideBrowser.home();
  }
  else if(a==='ibgo'){
    InsideBrowser.navigate($('#ibUrlInput')?.value);
  }
  else if(a==='openibnewtab'){
    InsideBrowser.openNewTab();
  }
  else if(a==='fb'){const m=c.msgs[+b.closest('.msg').dataset.i];m.fb=m.fb===b.dataset.v?null:b.dataset.v;save();drawMsgs()}
  else if(a==='retry'&&!run){while(c.msgs.at(-1)?.role==='assistant')c.msgs.pop();drawMsgs();await generate(c)}
});

document.addEventListener('keydown',e=>{
  if(e.target && e.target.id === 'ibUrlInput' && e.key === 'Enter'){
    e.preventDefault();
    InsideBrowser.navigate(e.target.value);
    return;
  }
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='n'){e.preventDefault();run?toast(t('stopGenFirst')):newChat()}
  else if(mod&&k==='k'){e.preventDefault();S.col=false;$('#side').classList.remove('col');$('#side').classList.add('open');$('#q').focus()}
  else if(mod&&k==='/'){e.preventDefault();$('#inp').focus()}else if(k==='escape'){closePop();closeDrawer()}
});
matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>S.theme==='system'&&applyTheme());

applyTheme();shell();InsideBrowser.init();
Axom.models().then(m=>{
  models=m;
  if(m.length&&!m.some(x=>x.id===S.model))S.model=m[0].id;
  save();
  updSend();
});
</script>
</body>
</html>
