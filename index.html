          fetch('/api/obsidian/sync', { method: 'POST' }).catch(()=>{});
        } catch(err) {
          toast('Failed to delete fact');
        }
      }
    }

    if (e.target.closest('[data-act="addmemfact"]')) {
      const key = await dialog({ title: 'New Memory Fact Key', body: 'Enter unique identifier (e.g. favorite_ide, timezone, target_platform):', input: '' });
      if (!key || !key.trim()) return;
      const cleanKey = key.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
      const val = await dialog({ title: `Value for "${cleanKey}"`, body: 'Enter fact value or preference description:', input: '' });
      if (!val || !val.trim()) return;
      try {
        await fetch('/api/memory/actions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ actions: [{ type: 'upsert', key: cleanKey, value: val.trim(), category: 'user_preference' }] })
        });
        const refRes = await fetch('/api/memory/profile');
        const refData = await refRes.json();
        profileData = refData.profile || [];
        renderModal();
        toast(`Added memory fact "${cleanKey}"`);
        fetch('/api/obsidian/sync', { method: 'POST' }).catch(()=>{});
      } catch(err) {
        toast('Failed to add memory fact');
      }
    }

    if (e.target.closest('[data-act="syncobsidianfrommem"]')) {
      toast('Syncing Obsidian vault...');
      try {
        const sr = await fetch('/api/obsidian/sync', { method: 'POST' });
        const sd = await sr.json();
        if (sd.success) toast(`Synced ${sd.noteCount || 115} notes to Obsidian (${sd.vaultName})`);
        else toast('Sync complete');
      } catch(err) {
        toast('Sync failed');
      }
    }
  };
}

    const q = query.toLowerCase().trim();
    const filtered = commands.filter(c => !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
    if (selectedIdx >= filtered.length) selectedIdx = Math.max(0, filtered.length - 1);

    const listHtml = filtered.map((c, i) => `
      <div class="cmd-palette-item ${i === selectedIdx ? 'selected' : ''}" data-cmd-id="${c.id}">
        <div class="cmd-icon">${ic(c.icon || 'code')}</div>
        <div class="cmd-text">
          <span class="cmd-title">${esc(c.title)}</span>
          <span class="cmd-desc">${esc(c.desc)}</span>
        </div>
        ${c.shortcut ? `<span class="cmd-shortcut">${c.shortcut}</span>` : ''}
      </div>
    `).join('');

    $('#cmdList', o).innerHTML = listHtml || '<div style="padding:24px;text-align:center;color:var(--tx3);font-size:12px">No matching commands found.</div>';
  }

  o.innerHTML = `<div class="modal cmd-palette-box">
    <div class="cmd-palette-input-wrap">
      ${ic('search')}
      <input type="text" id="cmdInput" placeholder="Type a command or search... (e.g. model, free, export, rag, theme)" autocomplete="off" autofocus>
      <kbd>ESC</kbd>
    </div>
    <div class="cmd-palette-list" id="cmdList"></div>
  </div>`;

  document.body.appendChild(o);
  renderList();

  const inputEl = $('#cmdInput', o);
  inputEl.focus();

  inputEl.oninput = () => {
    query = inputEl.value;
    selectedIdx = 0;
    renderList();
  };

  inputEl.onkeydown = (e) => {
    const q = query.toLowerCase().trim();
    const filtered = commands.filter(c => !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = (selectedIdx + 1) % (filtered.length || 1);
      renderList();
      $('.cmd-palette-item.selected', o)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = (selectedIdx - 1 + filtered.length) % (filtered.length || 1);
      renderList();
      $('.cmd-palette-item.selected', o)?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (filtered[selectedIdx]) {
        o.remove();
        filtered[selectedIdx].action();
      }
    } else if (e.key === 'Escape') {
      o.remove();
    }
  };

  o.onclick = (e) => {
    if (e.target === o) return o.remove();
    const item = e.target.closest('[data-cmd-id]');
    if (item) {
      const c = commands.find(x => x.id === item.dataset.cmdId);
      if (c) {
        o.remove();
        c.action();
      }
    }
  };
}

function exportChatMarkdown() {
  const session = S.sessions.find(s => s.id === S.cur);
  if (!session || !session.msgs.length) return toast('No messages in active conversation to export.');
  let md = '# AXOM Conversation Export\n\nSession ID: ' + session.id + '\nDate: ' + new Date().toISOString() + '\n\n---\n\n';
  for (const m of session.msgs) {
    const who = m.role === 'user' ? 'User' : 'AXOM';
    md += '### ' + who + ':\n\n' + (m.text || '') + '\n\n';
  }
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'axom_session_' + session.id + '.md';
  a.click();
  toast('Exported session to Markdown');
}

function exportChatJson() {
  const session = S.sessions.find(s => s.id === S.cur);
  if (!session) return toast('No active session to export.');
  const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'axom_session_' + session.id + '.json';
  a.click();
  toast('Exported session to JSON');
}

            <button class="free-hub-pill-btn ${currentFilter==='reasoning'?'on':''}" data-filter="reasoning">🧠 Deep Reasoning</button>
            <button class="free-hub-pill-btn ${currentFilter==='code'?'on':''}" data-filter="code">💻 Code Specialists</button>
            <button class="free-hub-pill-btn ${currentFilter==='large_context'?'on':''}" data-filter="large_context">📚 1M+ Context</button>
            <button class="free-hub-pill-btn ${currentFilter==='eu'?'on':''}" data-filter="eu">🇪🇺 EU Hosting</button>
          </div>
        </div>
        <div class="free-hub-search-box">
          ${ic('search')}
          <input type="text" id="freeHubSearchInput" placeholder="Filter by provider name, model, context, modality, or rate limit..." value="${esc(searchQuery)}" autofocus autocomplete="off">
        </div>
        <div class="free-hub-body" id="freeHubBody">
          ${cardsHtml.length ? cardsHtml : '<div style="text-align:center;padding:40px;color:var(--tx3)">No providers found matching your filter.</div>'}
        </div>
      </div>
    `;
  };

  o.innerHTML = renderContent();
  document.body.appendChild(o);

  const rebindEvents = () => {
    const searchInp = $('#freeHubSearchInput', o);
    if(searchInp){
      searchInp.value = searchQuery;
      searchInp.focus();
      searchInp.oninput = () => {
        searchQuery = searchInp.value.trim();
        const bodyEl = $('#freeHubBody', o);
        if(bodyEl){
          o.innerHTML = renderContent();
          rebindEvents();
        }
      };
    }
  };

  o.onclick = async e => {
    const target = e.target;
    if(target === o || target.closest('[data-act="closefreeapis"]')){
      o.remove();
      focusInput();
      return;
    }

    const filterBtn = target.closest('[data-filter]');
    if(filterBtn){
      currentFilter = filterBtn.dataset.filter;
      o.innerHTML = renderContent();
      rebindEvents();
      return;
    }

    const toggleBtn = target.closest('[data-act-togglesetup]');
    if(toggleBtn){
      const pId = toggleBtn.dataset.actTogglesetup;
      const wrap = $('#setup_' + pId, o);
      if(wrap){
        wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
      }
      return;
    }

    const saveKeyBtn = target.closest('[data-act-savefreekey]');
    if(saveKeyBtn){
      const pId = saveKeyBtn.dataset.actSavefreekey;
      const inp = o.querySelector(`[data-key-val="${pId}"]`);
      const val = inp?.value?.trim();
      if(val){
        saveKeyBtn.disabled = true;
        saveKeyBtn.textContent = 'Saving...';
        try {
          const payload = {};
          payload[pId] = val;
          const r = await fetch('/api/providers/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if(r.ok){
            toast('API Key saved for ' + pId);
            freeApisData = null; // force reload
            saveKeyBtn.textContent = 'Saved!';
            setTimeout(() => {
              openFreeApisHub(currentFilter);
            }, 400);
          }
        } catch(err){
          saveKeyBtn.disabled = false;
          saveKeyBtn.textContent = 'Save Key';
          toast('Save failed: ' + err.message);
        }
      }
      return;
    }

    const snippetBtn = target.closest('[data-act-snippet]');
    if(snippetBtn){
      const pId = snippetBtn.dataset.actSnippet;
      const mId = snippetBtn.dataset.model;
      openSnippetModal(pId, mId);
      return;
    }

    const testBtn = target.closest('[data-act-testfree]');
    if(testBtn){
      const pId = testBtn.dataset.actTestfree;
      const mId = testBtn.dataset.model || '';
      const feedbackEl = $('#test_' + pId, o);
      testBtn.disabled = true;
      const origText = testBtn.textContent;
      testBtn.textContent = 'Testing...';
      if(feedbackEl){
        feedbackEl.style.display = 'block';
        feedbackEl.style.background = 'rgba(59,130,246,.15)';
        feedbackEl.style.color = '#93c5fd';
        feedbackEl.textContent = 'Probing endpoint ' + pId + ' (' + mId + ')...';
      }

      try {
        const res = await fetch('/api/free-apis/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider_id: pId, model_id: mId })
        });
        const d = await res.json();
        testBtn.disabled = false;
        testBtn.textContent = origText;
        if(feedbackEl){
          if(d.ok){
            feedbackEl.style.background = 'rgba(16,185,129,.15)';
            feedbackEl.style.color = '#34d399';
            feedbackEl.innerHTML = '<strong>' + ic('check') + ' HTTP ' + d.status + ' OK (' + d.latency_ms + 'ms):</strong> ' + esc(d.reply);
          } else {
            feedbackEl.style.background = 'rgba(239,68,68,.15)';
            feedbackEl.style.color = '#f87171';
            feedbackEl.textContent = 'Failed: ' + (d.error || 'Connection error');
          }
        }
      } catch(tErr){
        testBtn.disabled = false;
        testBtn.textContent = origText;
        if(feedbackEl){
          feedbackEl.style.background = 'rgba(239,68,68,.15)';
          feedbackEl.style.color = '#f87171';
          feedbackEl.textContent = 'Error: ' + tErr.message;
        }
      }
      return;
    }
  };

  rebindEvents();
}

async function openSnippetModal(providerId, modelId){
  $('#snippetModal')?.remove();
  let lang = 'python';

  const modal = document.createElement('div');
  modal.className = 'ov snippet-ov';
  modal.id = 'snippetModal';

  const fetchAndRender = async () => {
    let snippet = '';
    try {
      const res = await fetch('/api/free-apis/snippet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider_id: providerId, model_id: modelId, language: lang })
      });
      const d = await res.json();
      snippet = d.snippet || '';
    } catch(e){}

    modal.innerHTML = `<div class="modal snippet-modal-box">
      <div class="mh">
        <div style="font-weight:600;display:flex;align-items:center;gap:8px">
          ${ic('code')}
          <span>Free Code Snippet: <strong>${esc(modelId)}</strong></span>
        </div>
        <button class="ib" data-act="closesnippet">${ic('x')}</button>
      </div>
      <div class="snippet-tabs">
        <button class="free-hub-pill-btn ${lang==='python'?'on':''}" data-lang="python">Python (OpenAI SDK)</button>
        <button class="free-hub-pill-btn ${lang==='curl'?'on':''}" data-lang="curl">cURL (REST API)</button>
        <button class="free-hub-pill-btn ${lang==='node'?'on':''}" data-lang="node">Node.js (Fetch / SDK)</button>
        <div style="flex:1"></div>
        <button class="btn pri" id="btnCopySnippet" style="padding:4px 12px;font-size:11px">${ic('copy')} <span>Copy</span></button>
      </div>
      <pre class="snippet-pre"><code id="snippetCode">${esc(snippet)}</code></pre>
    </div>`;
  };

  await fetchAndRender();
  document.body.appendChild(modal);

  modal.onclick = async e => {
    if(e.target === modal || e.target.closest('[data-act="closesnippet"]')) return modal.remove();
    const langBtn = e.target.closest('[data-lang]');
    if(langBtn){
      lang = langBtn.dataset.lang;
      await fetchAndRender();
    }
    if(e.target.closest('#btnCopySnippet')){
      const code = $('#snippetCode', modal)?.textContent || '';
      navigator.clipboard.writeText(code).then(() => toast('Snippet copied to clipboard!'));
    }
  };
}

    if(target.matches('[data-key-input]')){
      const provId=target.dataset.keyInput;

    if(target.id==='th'){S.theme=target.value;applyTheme()}if(target.id==='api')S.api=target.value.trim().replace(/\/$/,'');if(target.id==='ent')S.enterSends=target.checked;save();
    fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme:S.theme,gen:S.gen,effort:S.effort})});
  };
  o.onkeydown=e=>{if(e.key==='Escape')o.remove()}
}

    loadRagDocs();
  }
  shell();
  focusInput();
  toast(S.view === 'rag' ? 'Knowledge RAG' : 'AXOM Chat');
}

      openModelPicker();

    return;
  }
  else if(a==='selectmodel'){
    const mId = b.dataset.m || b.closest('[data-m]')?.dataset.m;
    if(mId){
      S.model = mId;
      save();
      updateHeaderModel();
      $('#modelPickerModal')?.remove();
      toast('Active Model: ' + getCurrentModelName());
      focusInput();
    }
    return;
  }
  else if(a==='ragupload'){
    $('#ragFileInput')?.click();
    return;
  }
  else if(a==='ragreindex'){
    const btn = $('#ragReindexBtn');
    if(btn){
      btn.disabled = true;
      btn.textContent = t('ragReindexing');
    }
    toast(t('ragReindexing'));
    try{
      const r = await RagApi.reindex();
      if(r.documents) ragDocs = r.documents;
      else await loadRagDocs();
      drawRagVault();
      toast(t('ragReindexDone'));
    }catch(err){
      toast('Re-index failed: ' + err.message);
    }finally{
      if(btn){
        btn.disabled = false;
        btn.innerHTML = `${ic('refresh')}<span>${t('ragReindex')}</span>`;
      }
    }
    return;
  }
  else if(a==='ragdel'){
    const file = b.dataset.file;
    if(!file) return;
    if(await dialog({ title: t('delTitle'), body: `"${esc(file)}" ${t('delConfirm')}`, ok: t('del'), danger: 1 })){
      try{
        const r = await RagApi.delete(file);
        if(r.documents) ragDocs = r.documents;
        else await loadRagDocs();
        drawRagVault();
        toast(t('ragDocDeleted'));
      }catch(err){
        toast('Delete failed: ' + err.message);
      }
    }
    return;
  }
  else if(a==='ragclear'){
    S.ragMsgs = [];
    save();
    drawRagMsgs();
    toast(t('ragClearChat'));
    return;
  }
  else if(a==='ragsend'){
    sendRag();
    return;
  }
  else if(a==='ragstop'){
    ragRun?.abort();
    return;
  }
  else if(a==='ragsug'){
    sendRag(b.dataset.q);
    return;
  }
  else if(a==='copyrag'){
    const m = S.ragMsgs[+b.dataset.i];
    if(m && m.text){
      navigator.clipboard.writeText(m.text).then(() => toast(t('copied')), () => toast(t('copyFailed')));
    }
    return;
  }
  else if(a==='inspectchunk'){
    const doc = b.dataset.doc;
    const chunk = b.dataset.chunk;
    const score = b.dataset.score;
    const dense = b.dataset.dense;
    const lex = b.dataset.lex;
    const text = b.dataset.text;
    inspectChunkModal({ doc, chunk, score, dense, lex, text });
    return;
  }
  else if(a==='closeinspect'){
    $('.ov')?.remove();
    return;
  }

  if(a==='gohome'||a==='new')newChat();
  else if(a==='setlang'){
    const targetLang=b.dataset.l;
    if(targetLang && targetLang !== S.lang){
      S.lang = targetLang;
      save();
      shell();
      toast(S.lang === 'pt' ? 'Idioma: Português' : 'Language: English');
    }
  }
  else if(a==='toggleweb'){
    S.web = !S.web;
    save();
    const btn=$('#webBtn');
    if(btn) btn.classList.toggle('on', !!S.web);
    toast(S.web ? t('webAuto') : t('webDisabled'));
  }
  else if(a==='theme'){S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();updateThemeLabel();save();}
  else if(a==='open'){S.cur=id;save();shell();closeDrawer();focusInput();}
  else if(a==='collapse'){S.col=!S.col;save();$('#side').classList.toggle('col',S.col)}
  else if(a==='drawer'){innerWidth<=800?$('#side').classList.toggle('open'):(S.col=!S.col,save(),$('#side').classList.toggle('col',S.col))}
  else if(a==='expandsearch'){S.col=false;save();$('#side').classList.remove('col');$('#q').focus()}
  else if(a==='send')send();else if(a==='stop'){if(S.cur && activeRuns.has(S.cur)){activeRuns.get(S.cur).controller.abort();activeRuns.delete(S.cur);updSend();focusInput();}}
  else if(a==='sug')send(b.dataset.t);
  else if(a==='attach')$('#file').click();
  else if(a==='voice')toggleVoice();
  else if(a==='rmfile'){atts.splice(+b.dataset.i,1);drawAtts();updSend()}
  else if(a==='settings')settings(b.dataset?.tab || 'appearance');
  else if(a==='openmodelsettings')settings('providers');
  else if(a==='menu'){e.stopPropagation();const v=S.convs.find(x=>x.id===id);popover(b,`<button data-act="rename" data-id="${id}">${t('rename')}</button><button data-act="autotitle" data-id="${id}">Auto-Title</button><button data-act="pinc" data-id="${id}">${v.pinned?t('unpin'):t('pin')}</button><button data-act="exp" data-id="${id}">${t('exportMd')}</button><button data-act="expjson" data-id="${id}">Export JSON</button><div class="sep"></div><button style="color:var(--err)" data-act="del" data-id="${id}">${t('del')}</button>`)}
  else if(a==='rename'){const v=S.convs.find(x=>x.id===id),rName=await dialog({title:t('renameTitle'),input:v.title,ok:t('rename')});if(rName?.trim()){v.title=rName.trim();save();shell()}}
  else if(a==='pinc'){const v=S.convs.find(x=>x.id===id);v.pinned=!v.pinned;save();$('#list').innerHTML=sideHTML()}
  else if(a==='autotitle'){
    const v=S.convs.find(x=>x.id===id);
    if(v && v.msgs.length >= 2){
      const uTurn = v.msgs.find(m => m.role === 'user');
      const aTurn = v.msgs.find(m => m.role === 'assistant');
      if(uTurn){
        toast('Synthesizing title...');
        try {
          const tr = await fetch('/api/conversation/title', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: uTurn.text, response: aTurn?.text || '' })
          });
          const td = await tr.json();
          if(td.ok && td.title){
            v.title = td.title;
            save();
            $('#list').innerHTML = sideHTML();
            if(S.cur === id) shell();
            toast('Title: ' + td.title);
          }
        } catch(e) {
          toast('Failed to generate title');
        }
      }
    }
  }
  else if(a==='expjson'){
    const v=S.convs.find(x=>x.id===id);
    if(v){
      const u=URL.createObjectURL(new Blob([JSON.stringify(v, null, 2)],{type:'application/json'}));
      const l=document.createElement('a');
      l.href=u;
      l.download=(v.title||'conversation').replace(/[^a-z0-9_-]/gi,'_')+'.json';
      l.click();
      URL.revokeObjectURL(u);
      toast('Exported JSON');
    }
  }
  else if(a==='exp'){const v=S.convs.find(x=>x.id===id),u=URL.createObjectURL(new Blob([v.msgs.map(m=>`**${m.role}**\n\n${m.text}`).join('\n\n---\n\n')],{type:'text/markdown'})),l=document.createElement('a');l.href=u;l.download=v.title+'.md';l.click();URL.revokeObjectURL(u)}
  else if(a==='del'){const v=S.convs.find(x=>x.id===id);if(await dialog({title:t('delTitle'),body:`"${esc(v.title)}" ${t('delConfirm')}`,ok:t('del'),danger:1})){S.convs=S.convs.filter(x=>x.id!==id);if(S.cur===id)S.cur=null;save();shell()}}
  else if(a==='editmsg'){
    const idx = +b.closest('.msg').dataset.i;
    const m = c.msgs[idx];
    if(m && m.text){
      const inp = $('#inp');
      if(inp){
        inp.value = m.text;
        inp.style.height = 'auto';
        inp.style.height = Math.min(inp.scrollHeight, 200) + 'px';
        inp.focus();
        toast('Message loaded into prompt');
      }
    }
  }
  else if(a==='speakmsg'){
    const idx = +b.closest('.msg').dataset.i;
    const m = c.msgs[idx];
    if(m && m.text) speakText(m.text, b);
  }
  else if(a==='scrollbottom'){
    const chat = $('#chat');
    if(chat){
      chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
      userScrolledUp = false;
      const btn = $('#scrollBottomBtn');
      if(btn) btn.classList.remove('visible');
    }
  }
  else if(a==='copymsg'){const m=c.msgs[+b.closest('.msg').dataset.i];navigator.clipboard.writeText(m.text).then(()=>toast(t('copied')),()=>toast(t('copyFailed')))}
  else if(a==='copycode'){navigator.clipboard.writeText($('code',b.closest('.cb')).textContent).then(()=>{const orig=b.innerHTML;b.innerHTML=`${ic('check')} <span>${t('copiedCode')}</span>`;setTimeout(()=>b.innerHTML=orig,1400)},()=>toast(t('copyFailed')))}
  else if(a==='openinbrowser'){
    e.preventDefault();
    const url = b.dataset.url || b.getAttribute('href');
    if(url) InsideBrowser.open(url);
  }
  else if(a==='runcode'){
    const cb = b.closest('.cb');
    if(!cb) return;
    const code = $('pre code', cb)?.textContent || '';
    const lang = (b.dataset.lang || 'python').toLowerCase();
    let term = $('.cb-exec-terminal', cb);
    if(!term){
      term = document.createElement('div');
      term.className = 'cb-exec-terminal';
      cb.appendChild(term);
    }
    term.innerHTML = `<div class="cb-term-head">
      <span class="cb-term-title" style="color:#60a5fa">${ic('zap')} Running ${esc(lang)}...</span>
    </div>
    <div class="cb-term-body" style="padding:10px 14px;color:var(--tx3);font-size:11px">Executing in local sandbox...</div>`;
    b.disabled = true;
    const t0 = Date.now();
    try {
      const res = await fetch('/api/execute_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: lang, code, timeout_ms: 6000 })
      });
      const data = await res.json();
      const dur = Date.now() - t0;
      const statusColor = data.exitCode === 0 ? '#4ade80' : '#f87171';
      const outText = (data.stdout || '') + (data.stderr ? ('\n' + data.stderr) : '') || '(Process completed with no console output)';
      term.innerHTML = `<div class="cb-term-head">
        <span class="cb-term-title" style="color:${statusColor}">${ic('zap')} Exit ${data.exitCode ?? 0} · ${dur}ms</span>
        <div style="display:flex;align-items:center;gap:4px">
          <button class="ib" data-act="copyterm" title="Copy Output" style="width:20px;height:20px;color:var(--tx3)">${ic('copy')}</button>
          <button class="ib" data-act="closeterm" title="Close Terminal" style="width:20px;height:20px;color:var(--tx3)">${ic('x')}</button>
        </div>
      </div>
      <div class="cb-term-body" style="padding:10px 14px;color:#f4f4f5;max-height:220px;overflow-y:auto;white-space:pre-wrap">${esc(outText)}</div>`;
    } catch(err) {
      term.innerHTML = `<div class="cb-term-body" style="padding:10px 14px;color:#f87171;font-size:11px">Execution failed: ${esc(err.message)}</div>`;
    } finally {
      b.disabled = false;
    }
  }
  else if(a==='closeterm'){
    b.closest('.cb-exec-terminal')?.remove();
  }
  else if(a==='copyterm'){
    const term = b.closest('.cb-exec-terminal');
    const body = term ? $('.cb-term-body', term)?.textContent || '' : '';
    if(body){
      navigator.clipboard.writeText(body);
      toast('Terminal output copied to clipboard');
    }
  }
  else if(a==='openpalette'){
    openCommandPalette();
  }
  else if(a==='clearsubagent'){
    S.subagent = null;
    save();
    updateSubagentBadge();
    toast('Subagent persona cleared');
  }
  else if(a==='openpreview'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      InsideBrowser.open('data:text/html;charset=utf-8,' + encodeURIComponent(code));
    }
  }
  else if(a==='saveworkspace'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      const tag = $('.cb-tag', cb)?.textContent?.trim() || 'file';
      const ext = tag.includes(' ') ? tag.split(' ').pop() : tag;
      const cleanExt = ext.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 10);
      const defName = 'modified_' + (cleanExt ? 'script.' + cleanExt : 'document.txt');
      const filename = await dialog({ title: t('saveToWorkspace'), input: defName, ok: t('saveBtn') });
      if(filename && filename.trim()){
        try {
          const res = await fetch('/api/files/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename.trim(), content: code })
          });
          if(res.ok) {
            toast(t('savedToWorkspace') + ` (${filename.trim()})`);
          } else {
            toast('Save failed');
          }
        } catch(err){ toast('Save failed'); }
      }
    }
  }
  else if(a==='downloadcode'){
    const cb = b.closest('.cb');
    if(cb){
      const code = $('pre code', cb)?.textContent || '';
      const tag = $('.cb-tag', cb)?.textContent?.trim() || 'file';
      const ext = tag.includes(' ') ? tag.split(' ').pop() : tag;
      const cleanExt = ext.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 10);
      const filename = 'modified_' + (cleanExt ? 'file.' + cleanExt : 'document.txt');
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename; link.click(); URL.revokeObjectURL(url);
      toast(t('downloadBtn') + ` (${filename})`);
    }
  }
  else if(a==='togglebrowser'){
    InsideBrowser.toggle();
  }
  else if(a==='closeib'){
    InsideBrowser.close();
  }
  else if(a==='maximizeib'){
    InsideBrowser.toggleMaximize();
  }
  else if(a==='reloadib'){
    InsideBrowser.reload();
  }
  else if(a==='ibback'){
    InsideBrowser.back();
  }
  else if(a==='ibfwd'){
    InsideBrowser.forward();
  }
  else if(a==='ibhome'){
    InsideBrowser.home();
  }
  else if(a==='ibgo'){
    InsideBrowser.navigate($('#ibUrlInput')?.value);
  }
  else if(a==='openibnewtab'){
    InsideBrowser.openNewTab();
  }
  else if(a==='fb'){const m=c.msgs[+b.closest('.msg').dataset.i];m.fb=m.fb===b.dataset.v?null:b.dataset.v;save();drawMsgs()}
  else if(a==='retry'&&!run){while(c.msgs.at(-1)?.role==='assistant')c.msgs.pop();drawMsgs();await generate(c)}
});

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;

  // Global Command Palette & Overlay Dismissals (active even when modal is open)
  if(mod && k === 'k'){
    e.preventDefault();
    if($('#cmdPalette')){ $('#cmdPalette').remove(); }
    else { openCommandPalette(); }
    return;
  }
  if(k === 'escape'){
    if($('#cmdPalette')){ $('#cmdPalette').remove(); return; }
    if($('#memoryViewerModal')){ $('#memoryViewerModal').remove(); return; }
    if($('#modelPickerModal')){ $('#modelPickerModal').remove(); return; }
    closePop();
    closeDrawer();
  }
  if(mod && e.shiftKey && k === 'e'){
    e.preventDefault();
    exportChatJson();
    return;
  }

  // If modal or popover is open, ignore
  if($('.ov') || pop) return;

  // Direct typing capture: if user types a printable key while not in another input, automatically focus input
  if(!e.ctrlKey && !e.metaKey && !e.altKey && e.key && e.key.length === 1 && !e.isComposing){
    const active = document.activeElement;
    const isInputActive = active && (
      active.tagName === 'INPUT' ||
      active.tagName === 'TEXTAREA' ||
      active.isContentEditable ||
      Boolean(active.closest && active.closest('.modal'))
    );
    if(!isInputActive){
      const el = (S.view === 'rag') ? $('#ragInp') : $('#inp');
      if(el){
        el.focus();
      }
    }
  }

  if(e.target && e.target.id === 'ibUrlInput' && e.key === 'Enter'){
    e.preventDefault();
    InsideBrowser.navigate(e.target.value);
    return;
  }

  if(mod&&k==='n'){e.preventDefault();newChat();focusInput();}
  else if(mod&&k==='1'){e.preventDefault();setView('chat');}
  else if(mod&&k==='2'){e.preventDefault();setView('rag');}
  else if(mod&&k==='m'){e.preventDefault();openModelPicker();}
  else if(mod&&e.shiftKey&&k==='f'){e.preventDefault();openFreeApisHub();}
  else if(mod&&k==='/'){e.preventDefault();focusInput();}
});
matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>S.theme==='system'&&applyTheme());

// Inline citation inspector listener
document.addEventListener('click', e => {
  const citEl = e.target.closest('.inline-cit');
  if(citEl){
    const doc = citEl.dataset.doc;
    const chunkId = parseInt(citEl.dataset.chunk || '0', 10);
    let matchedChunk = null;
    for(let k = S.ragMsgs.length - 1; k >= 0; k--){
      const cList = S.ragMsgs[k].citations || [];
      matchedChunk = cList.find(c => c.doc === doc && c.chunk_id === chunkId);
      if(matchedChunk) break;
    }
    if(matchedChunk){
      inspectChunkModal({
        doc: matchedChunk.doc,
        chunk: matchedChunk.chunk_id,
        score: Math.round((matchedChunk.score||0)*100),
        dense: Math.round((matchedChunk.dense_score||0)*100),
        lex: Math.round((matchedChunk.lexical_score||0)*100),
        text: matchedChunk.text || ''
      });
    } else {
      toast(`${doc} #${chunkId}`);
    }
  }
});

applyTheme();shell();InsideBrowser.init();loadRagDocs();focusInput();
window.addEventListener('load', focusInput);
window.addEventListener('focus', focusInput);
document.addEventListener('visibilitychange', () => { if (!document.hidden) focusInput(); });
document.addEventListener('click', e => {
  const isInteractive = e.target.closest('button, a, input, textarea, select, details, [data-act], .modal, .pop, .cb');
  const hasSelection = window.getSelection && window.getSelection().toString().length > 0;
  if (!isInteractive && !hasSelection) {
    focusInput();
  }
}, true);
Axom.models().then(m=>{
  models=m;
  if(!S.model) S.model='auto';
  updateHeaderModel();
  save();
  updSend();
});
